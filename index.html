<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>СК Квадрант — Учёт аренды</title>
    <!-- Bootstrap + иконки -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { padding-top: 70px; background: #f4f6fa; }
        .navbar-brand { font-weight: 800; letter-spacing: -0.5px; color: #fff !important; }
        .brand-highlight { color: #ffc107; }
        .card-dashboard {
            transition: 0.3s;
            border: none;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .card-dashboard:hover {
            transform: translateY(-6px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.10);
        }
        .card-dashboard .card-body { padding: 1.5rem; }
        .card-dashboard h5 { font-size: 0.85rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; opacity: 0.8; }
        .card-dashboard h2, .card-dashboard h3 { font-weight: 700; }

        .filter-section {
            background: #fff;
            padding: 12px 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            margin-bottom: 20px;
        }
        .table th { font-weight: 600; color: #2c3e50; border-top: none; }
        .table td { vertical-align: middle; }
        .rental-badge { font-size: 0.7rem; padding: 0.35rem 0.65rem; border-radius: 20px; }
        .btn-edit { margin-right: 4px; }
        .login-container {
            max-width: 420px;
            margin: 60px auto;
            background: #fff;
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 12px 48px rgba(0,0,0,0.08);
        }
        .login-container h2 { font-weight: 700; color: #1a1a2e; }
        .login-container .brand-icon { font-size: 2.5rem; color: #0d6efd; }
        .hidden { display: none; }

        .chart-container {
            background: #fff;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .chart-bar {
            display: flex;
            align-items: flex-end;
            height: 140px;
            gap: 8px;
            padding-top: 12px;
        }
        .chart-bar-item {
            flex: 1;
            min-height: 6px;
            border-radius: 6px 6px 0 0;
            transition: 0.3s;
            position: relative;
            cursor: pointer;
            background: #e9ecef;
        }
        .chart-bar-item:hover {
            opacity: 0.8;
            transform: scaleY(1.03);
        }
        .chart-bar-item .tooltip-text {
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: #1a1a2e;
            color: #fff;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            white-space: nowrap;
            display: none;
            font-weight: 500;
        }
        .chart-bar-item:hover .tooltip-text { display: block; }
        .chart-label {
            font-size: 10px;
            text-align: center;
            margin-top: 6px;
            color: #6c757d;
            font-weight: 500;
        }

        .toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 9999; }
        .toast-custom {
            background: #1a1a2e;
            color: #fff;
            border-radius: 12px;
            padding: 14px 24px;
            margin-bottom: 10px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 12px;
            animation: slideUp 0.3s ease;
        }
        .toast-custom.success { background: #198754; }
        .toast-custom.danger { background: #dc3545; }
        .toast-custom.warning { background: #ffc107; color: #1a1a2e; }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .spinner-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9998;
        }
        .spinner-overlay .spinner-border { width: 3rem; height: 3rem; }

        @media (max-width: 576px) {
            .card-dashboard .card-body { padding: 1rem; }
            .login-container { margin: 30px 15px; padding: 30px 20px; }
            .table-responsive { font-size: 0.85rem; }
        }

        [data-tooltip] { position: relative; }
        [data-tooltip]:hover::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: calc(100% + 6px);
            left: 50%;
            transform: translateX(-50%);
            background: #1a1a2e;
            color: #fff;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            white-space: nowrap;
            font-weight: 500;
            z-index: 1000;
        }
        .fade-enter { opacity: 0; transform: translateY(10px); }
        .fade-enter-active { opacity: 1; transform: translateY(0); transition: opacity 0.3s ease, transform 0.3s ease; }

        /* Дополнительно для улучшения интерфейса */
        .btn-back { margin-right: 10px; }
    </style>
</head>
<body>

<!-- НАВИГАЦИЯ -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top" id="mainNav">
    <div class="container">
        <span class="navbar-brand" style="cursor:default;">
            <i class="bi bi-tools me-2"></i>СК <span class="brand-highlight">Квадрант</span>
        </span>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav me-auto" id="navList">
                <li class="nav-item"><a class="nav-link active" href="#" data-page="dashboard"><i class="bi bi-speedometer2 me-1"></i>Дашборд</a></li>
                <li class="nav-item"><a class="nav-link" href="#" data-page="tools"><i class="bi bi-hammer me-1"></i>Инструменты</a></li>
                <li class="nav-item"><a class="nav-link" href="#" data-page="clients"><i class="bi bi-people me-1"></i>Клиенты</a></li>
                <li class="nav-item"><a class="nav-link" href="#" data-page="newRental"><i class="bi bi-plus-circle me-1"></i>Выдать</a></li>
                <li class="nav-item"><a class="nav-link" href="#" data-page="activeRentals"><i class="bi bi-play-circle me-1"></i>Активные</a></li>
                <li class="nav-item"><a class="nav-link" href="#" data-page="bookings"><i class="bi bi-calendar-check me-1"></i>Брони</a></li>
                <li class="nav-item"><a class="nav-link" href="#" data-page="returnRental"><i class="bi bi-arrow-return-left me-1"></i>Вернуть</a></li>
                <li class="nav-item"><a class="nav-link" href="#" data-page="repair"><i class="bi bi-wrench me-1"></i>ТО</a></li>
                <li class="nav-item"><a class="nav-link" href="#" data-page="history"><i class="bi bi-clock-history me-1"></i>История</a></li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link" href="#" onclick="logout()"><i class="bi bi-box-arrow-right me-1"></i>Выйти</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- ОСНОВНОЙ КОНТЕЙНЕР -->
<div class="container" id="app">
    <!-- Логин -->
    <div id="loginPage" class="login-container">
        <div class="text-center mb-4">
            <i class="bi bi-tools brand-icon"></i>
            <h2 class="mt-2">СК Квадрант</h2>
            <p class="text-muted">Учёт аренды строительного инструмента</p>
        </div>
        <form onsubmit="login(event)">
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" id="loginEmail" class="form-control" placeholder="example@mail.ru" required />
            </div>
            <div class="mb-3">
                <label class="form-label">Пароль</label>
                <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required />
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2">Войти</button>
            <hr />
            <p class="text-center text-muted small">Нет аккаунта? <a href="#" onclick="showRegister()">Зарегистрируйтесь</a></p>
        </form>
    </div>

    <!-- Регистрация -->
    <div id="registerPage" class="login-container hidden">
        <div class="text-center mb-4">
            <i class="bi bi-person-plus brand-icon"></i>
            <h2 class="mt-2">Регистрация</h2>
        </div>
        <form onsubmit="register(event)">
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" id="regEmail" class="form-control" required />
            </div>
            <div class="mb-3">
                <label class="form-label">Пароль (≥6 символов)</label>
                <input type="password" id="regPassword" class="form-control" required minlength="6" />
            </div>
            <button type="submit" class="btn btn-success w-100 py-2">Зарегистрироваться</button>
            <hr />
            <p class="text-center text-muted small">Уже есть аккаунт? <a href="#" onclick="showLogin()">Войдите</a></p>
        </form>
    </div>

    <!-- Основное приложение -->
    <div id="mainApp" class="hidden">
        <div id="appContent"></div>
    </div>
</div>

<!-- Контейнер для уведомлений -->
<div class="toast-container" id="toastContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    (function() {
        'use strict';

        // ===== SUPABASE =====
        const SUPABASE_URL = 'https://jptbqcbpllffgufusibj.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_gHL-E4wUy2KbNnwcnxj-Cw_pY5eaxth';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ===== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ =====
        function genId() { return Date.now().toString(36) + Math.random().toString(36).substring(2, 8); }
        function todayStr() { return new Date().toISOString().split('T')[0]; }
        function formatDate(dateStr) { if (!dateStr) return '—'; return new Date(dateStr).toLocaleDateString('ru-RU'); }
        function formatDateShort(dateStr) { if (!dateStr) return '—'; return new Date(dateStr).toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' }); }
        function daysBetween(date1, date2) { return Math.ceil((new Date(date2) - new Date(date1)) / (1000*60*60*24)); }
        function getStatusColor(status) {
            const map = {
                'в наличии': 'success', 'в аренде': 'warning', 'на обслуживании': 'danger',
                'забронирован': 'info', 'активна': 'warning', 'закрыта': 'secondary',
                'просрочена': 'danger', 'забронирована': 'info'
            };
            return map[status] || 'secondary';
        }

        // ===== ГЛОБАЛЬНЫЕ ДАННЫЕ =====
        let tools = [], clients = [], rentals = [];
        let currentPage = 'dashboard'; // для кнопки "Назад"
        let previousPage = 'dashboard';

        // ===== ЗАГРУЗКА ДАННЫХ =====
        async function loadTools() { const { data, error } = await supabase.from('tools').select('*'); if (error) { console.error(error); return []; } return data || []; }
        async function loadClients() { const { data, error } = await supabase.from('clients').select('*'); if (error) { console.error(error); return []; } return data || []; }
        async function loadRentals() { const { data, error } = await supabase.from('rentals').select('*'); if (error) { console.error(error); return []; } return data || []; }
        async function refreshAllData() {
            showSpinner();
            [tools, clients, rentals] = await Promise.all([loadTools(), loadClients(), loadRentals()]);
            hideSpinner();
        }

        function getToolById(id) { return tools.find(t => t.id === id); }
        function getClientById(id) { return clients.find(c => c.id === id); }

        // ===== СПИННЕР =====
        function showSpinner() {
            if (!document.getElementById('spinnerOverlay')) {
                const overlay = document.createElement('div');
                overlay.id = 'spinnerOverlay';
                overlay.className = 'spinner-overlay';
                overlay.innerHTML = '<div class="spinner-border text-primary" role="status"><span class="visually-hidden">Загрузка...</span></div>';
                document.body.appendChild(overlay);
            }
        }
        function hideSpinner() {
            const el = document.getElementById('spinnerOverlay');
            if (el) el.remove();
        }

        // ===== УВЕДОМЛЕНИЯ =====
        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast-custom ${type}`;
            toast.innerHTML = `<span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => { toast.remove(); }, 4000);
        }

        // ===== НАВИГАЦИЯ =====
        function navigate(page) {
            if (page !== currentPage) {
                previousPage = currentPage;
                currentPage = page;
            }
            document.querySelectorAll('#navList .nav-link').forEach(el => el.classList.remove('active'));
            const link = document.querySelector(`#navList .nav-link[data-page="${page}"]`);
            if (link) link.classList.add('active');

            const content = document.getElementById('appContent');
            content.classList.remove('fade-enter-active');
            content.classList.add('fade-enter');

            switch (page) {
                case 'dashboard':       renderDashboard(content); break;
                case 'tools':           renderTools(content); break;
                case 'clients':         renderClients(content); break;
                case 'newRental':       renderNewRental(content); break;
                case 'activeRentals':   renderActiveRentals(content); break;
                case 'bookings':        renderBookings(content); break;
                case 'returnRental':    renderReturnRental(content); break;
                case 'repair':          renderRepair(content); break;
                case 'history':         renderHistory(content); break;
                default: renderDashboard(content);
            }

            requestAnimationFrame(() => {
                content.classList.remove('fade-enter');
                content.classList.add('fade-enter-active');
            });
        }

        function goBack() {
            if (previousPage && previousPage !== currentPage) {
                navigate(previousPage);
            } else {
                navigate('dashboard');
            }
        }

        document.querySelector('#navList').addEventListener('click', function(e) {
            const link = e.target.closest('.nav-link');
            if (!link) return;
            const page = link.dataset.page;
            if (page) navigate(page);
        });

        // ===== РЕНДЕР (общий) =====
        function render(container, html) {
            container.innerHTML = html;
        }

        // ===== ДАШБОРД =====
        function renderDashboard(container) {
            const total = tools.length;
            const available = tools.filter(t => t.status === 'в наличии').length;
            const rented = tools.filter(t => t.status === 'в аренде').length;
            const maintenance = tools.filter(t => t.status === 'на обслуживании').length;
            const reserved = tools.filter(t => t.status === 'забронирован').length;
            const activeRentals = rentals.filter(r => r.status === 'активна').length;
            const bookings = rentals.filter(r => r.status === 'забронирована').length;
            const today = todayStr();
            const revenueToday = rentals.filter(r => r.status === 'закрыта' && r.actual_return === today).reduce((sum, r) => sum + (r.total_cost || 0), 0);
            const revenueMonth = rentals.filter(r => r.status === 'закрыта' && r.actual_return && new Date(r.actual_return) >= new Date(new Date().setDate(1))).reduce((sum, r) => sum + (r.total_cost || 0), 0);
            const totalDeposits = rentals.filter(r => r.status === 'закрыта' && !r.deposit_returned).reduce((sum, r) => sum + (r.deposit || 0), 0);

            const todayDate = new Date(today);
            const overdue = rentals.filter(r => r.status === 'активна' && new Date(r.planned_return) < todayDate);
            const returningSoon = rentals.filter(r => r.status === 'активна' && (daysBetween(today, r.planned_return) >= 0 && daysBetween(today, r.planned_return) <= 2));

            // График
            const chartData = [];
            for (let i = 6; i >= 0; i--) {
                const d = new Date(today); d.setDate(d.getDate() - i);
                const dateStr = d.toISOString().split('T')[0];
                const dayRevenue = rentals.filter(r => r.status === 'закрыта' && r.actual_return === dateStr).reduce((sum, r) => sum + (r.total_cost || 0), 0);
                chartData.push({ date: dateStr, revenue: dayRevenue });
            }
            const maxRevenue = Math.max(...chartData.map(d => d.revenue), 1);

            // Последние аренды
            const recent = [...rentals].filter(r => r.status !== 'забронирована').sort((a, b) => (b.id || '').localeCompare(a.id || '')).slice(0, 5);

            let html = `
            <h1 class="mb-4">Дашборд</h1>
            <!-- Уведомления -->
            <div class="row g-3 mb-4">
                ${overdue.length > 0 ? `
                <div class="col-md-6">
                    <div class="card text-bg-danger card-dashboard">
                        <div class="card-body">
                            <h5><i class="bi bi-exclamation-triangle-fill me-2"></i>Просрочено: ${overdue.length}</h5>
                            <p class="small mb-0">${overdue.map(r => { const c = getClientById(r.client_id); const t = getToolById(r.tool_id); return `${c ? c.name : '—'} (${t ? t.model : '—'})`; }).join(', ')}</p>
                            <a href="#" onclick="navigate('activeRentals')" class="btn btn-sm btn-light mt-2">Посмотреть</a>
                        </div>
                    </div>
                </div>
                ` : ''}
                ${returningSoon.length > 0 ? `
                <div class="col-md-6">
                    <div class="card text-bg-warning card-dashboard">
                        <div class="card-body">
                            <h5><i class="bi bi-clock-history me-2"></i>Скоро возврат: ${returningSoon.length}</h5>
                            <p class="small mb-0">${returningSoon.map(r => { const c = getClientById(r.client_id); const t = getToolById(r.tool_id); return `${c ? c.name : '—'} (${t ? t.model : '—'})`; }).join(', ')}</p>
                            <a href="#" onclick="navigate('activeRentals')" class="btn btn-sm btn-dark mt-2">Посмотреть</a>
                        </div>
                    </div>
                </div>
                ` : ''}
                ${overdue.length === 0 && returningSoon.length === 0 ? `<div class="col-12"><div class="alert alert-success">✅ Все аренды в порядке</div></div>` : ''}
            </div>

            <!-- Карточки метрик -->
            <div class="row g-3">
                <div class="col-md-2 col-6"><div class="card text-bg-primary card-dashboard"><div class="card-body"><h5>Всего</h5><h2>${total}</h2></div></div></div>
                <div class="col-md-2 col-6"><div class="card text-bg-success card-dashboard"><div class="card-body"><h5>Свободно</h5><h2>${available}</h2></div></div></div>
                <div class="col-md-2 col-6"><div class="card text-bg-warning card-dashboard"><div class="card-body"><h5>В аренде</h5><h2>${rented}</h2></div></div></div>
                <div class="col-md-2 col-6"><div class="card text-bg-info card-dashboard"><div class="card-body"><h5>Забронировано</h5><h2>${reserved}</h2></div></div></div>
                <div class="col-md-2 col-6"><div class="card text-bg-danger card-dashboard"><div class="card-body"><h5>На ТО</h5><h2>${maintenance}</h2></div></div></div>
                <div class="col-md-2 col-6"><div class="card text-bg-secondary card-dashboard"><div class="card-body"><h5>Броней</h5><h2>${bookings}</h2></div></div></div>
            </div>

            <!-- Дополнительные метрики -->
            <div class="row mt-4 g-3">
                <div class="col-md-4"><div class="card card-dashboard"><div class="card-body"><h5>Выручка сегодня</h5><h3>${revenueToday} ₽</h3></div></div></div>
                <div class="col-md-4"><div class="card card-dashboard"><div class="card-body"><h5>Выручка за месяц</h5><h3>${revenueMonth} ₽</h3></div></div></div>
                <div class="col-md-4"><div class="card card-dashboard"><div class="card-body"><h5>Невозвращённые залоги</h5><h3>${totalDeposits} ₽</h3></div></div></div>
            </div>

            <!-- График -->
            <div class="chart-container mt-4">
                <h5>Выручка за последние 7 дней (кликните по столбцу)</h5>
                <div class="chart-bar">
                    ${chartData.map(d => `
                    <div style="flex:1; display:flex; flex-direction:column; align-items:center;">
                        <div class="chart-bar-item" style="height: ${(d.revenue / maxRevenue) * 100}%; min-height: 6px; background: ${d.revenue > 0 ? '#0d6efd' : '#e9ecef'};" onclick="showDayDetails('${d.date}')">
                            <span class="tooltip-text">${d.revenue} ₽</span>
                        </div>
                        <div class="chart-label">${formatDateShort(d.date)}</div>
                    </div>
                    `).join('')}
                </div>
            </div>

            <h4 class="mt-4">Последние аренды</h4>
            <div class="table-responsive"><table class="table table-striped table-hover">
                <thead><tr><th>№</th><th>Клиент</th><th>Инструмент</th><th>Выдача</th><th>Возврат (план)</th><th>Статус</th></tr></thead>
                <tbody>
                ${recent.length === 0 ? '<tr><td colspan="6" class="text-center text-muted">Нет записей</td></tr>' : 
                    recent.map(r => {
                        const c = getClientById(r.client_id), t = getToolById(r.tool_id);
                        return `<tr><td>${r.rental_number || '—'}</td><td>${c ? c.name : 'Удалён'}</td><td>${t ? t.model : 'Удалён'}</td><td>${formatDate(r.issue_date)}</td><td>${formatDate(r.planned_return)}</td><td><span class="badge bg-${getStatusColor(r.status)} rental-badge">${r.status || '—'}</span></td></tr>`;
                    }).join('')
                }
                </tbody></table></div>`;

            render(container, html);
        }

        // Функция для клика по столбцу графика
        window.showDayDetails = function(date) {
            const dayRentals = rentals.filter(r => r.status === 'закрыта' && r.actual_return === date);
            if (dayRentals.length === 0) {
                showToast('За этот день нет закрытых аренд', 'warning');
                return;
            }
            let msg = `Аренды за ${formatDate(date)}:\n`;
            dayRentals.forEach(r => {

        window._saveRental = async function(e) {
            e.preventDefault();
            const clientId = document.getElementById('rClient').value;
            const toolId = document.getElementById('rTool').value;
            const days = parseInt(document.getElementById('rDays').value) || 1;
            const issueDate = document.getElementById('rDate').value;
            const comment = document.getElementById('rComment').value.trim();
            const reserve = document.getElementById('rReserve').checked;

            if (!clientId) { showToast('Выберите клиента', 'danger'); return; }
            if (!toolId) { showToast('Выберите инструмент', 'danger'); return; }

            const tool = getToolById(toolId);
            if (!tool || (tool.status !== 'в наличии' && tool.status !== 'забронирован')) {
                showToast('Инструмент недоступен', 'danger');
                return;
            }

            if (tool.status === 'забронирован' && tool.reserved_until) {
                if (new Date(tool.reserved_until) < new Date(issueDate)) {
                    showToast('Бронь на этот инструмент истекла. Обновите страницу.', 'danger');
                    return;
                }
            }

            const planned = new Date(issueDate);
            planned.setDate(planned.getDate() + days);

            const rental = {
                id: genId(),
                rental_number: 'AR-' + Date.now().toString(36).toUpperCase(),
                client_id: clientId,
                tool_id: toolId,
                issue_date: issueDate,
                planned_return: planned.toISOString().split('T')[0],
                actual_return: null,
                price_per_day: tool.price_per_day,
                total_cost: tool.price_per_day * days,
                deposit: tool.deposit,
                status: reserve ? 'забронирована' : 'активна',
                return_condition: '',
                comment: comment,
                deposit_returned: false
            };

            const toolUpdate = {
                status: reserve ? 'забронирован' : 'в аренде',
                reserved_until: reserve ? issueDate : null
            };

            showSpinner();
            const { error: toolError } = await supabase.from('tools').update(toolUpdate).eq('id', toolId);
            if (toolError) { showToast('Ошибка обновления инструмента: ' + toolError.message, 'danger'); hideSpinner(); return; }

            const { error: rentalError } = await supabase.from('rentals').insert(rental);
            if (rentalError) { showToast('Ошибка создания аренды: ' + rentalError.message, 'danger'); hideSpinner(); return; }

            await refreshAllData();
            hideSpinner();
            showToast('Аренда оформлена', 'success');
            navigate('dashboard');
        };

            const searchInput = document.getElementById('activeSearch');

            const search = searchInput ? searchInput.value : '';
            const status = statusSelect ? statusSelect.value : '';

            const active = rentals.filter(r => r.status === 'активна');
            let filtered = active;
            if (search) filtered = filtered.filter(r => {
                const c = getClientById(r.client_id);
                const t = getToolById(r.tool_id);
                return (c?.name?.toLowerCase().includes(search.toLowerCase()) || t?.model?.toLowerCase().includes(search.toLowerCase()) || r.rental_number?.toLowerCase().includes(search.toLowerCase()));
            });
            const today = new Date(todayStr());
            if (status === 'просрочена') {
                filtered = filtered.filter(r => new Date(r.planned_return) < today);
            } else if (status === 'soon') {
                filtered = filtered.filter(r => {
                    const diff = daysBetween(todayStr(), r.planned_return);

                });
            }

            let html = `

        window._returnRental = async function(sendToRepair) {
            const rentalId = document.getElementById('retRental').value;
            const actualReturn = document.getElementById('retDate').value;
            const condition = document.getElementById('retCondition') ? document.getElementById('retCondition').value : 'Хорошее';
            const depositReturned = document.getElementById('retDepositReturned').checked;
            if (!rentalId) { showToast('Выберите аренду', 'danger'); return; }

            const rental = rentals.find(r => r.id === rentalId);
            if (!rental) return;

            const planned = new Date(rental.planned_return);
            const actual = new Date(actualReturn);
            let totalCost = rental.total_cost;
            if (actual > planned) {
                const extraDays = Math.ceil((actual - planned) / (1000 * 60 * 60 * 24));
                totalCost += extraDays * rental.price_per_day;
            }

            showSpinner();
            const { error: rentalError } = await supabase.from('rentals').update({
                actual_return: actualReturn,
                status: 'закрыта',
                return_condition: condition,
                total_cost: totalCost,
                deposit_returned: depositReturned
            }).eq('id', rentalId);
            if (rentalError) { showToast('Ошибка обновления аренды: ' + rentalError.message, 'danger'); hideSpinner(); return; }

            const toolId = rental.tool_id;
            const toolUpdate = sendToRepair
                ? { status: 'на обслуживании', repair_reason: condition, repair_date: actualReturn }
                : { status: 'в наличии', repair_reason: '', repair_date: null };
            const { error: toolError } = await supabase.from('tools').update(toolUpdate).eq('id', toolId);
            if (toolError) { showToast('Ошибка обновления инструмента: ' + toolError.message, 'danger'); hideSpinner(); return; }

            await refreshAllData();
            hideSpinner();
            showToast('Инструмент возвращён', 'success');
            navigate('dashboard');
        };

        window._exportCSV = function() {
            if (rentals.length === 0) { showToast('Нет данных для экспорта', 'warning'); return; }
            let csv = '№,Клиент,Инструмент,Выдача,План возврат,Факт возврат,Цена/сутки,Сумма,Залог,Залог возвращён,Состояние,Комментарий,Статус\n';
            rentals.forEach(r => {
                const c = getClientById(r.client_id);
                const t = getToolById(r.tool_id);
                csv += `"${r.rental_number || ''}","${c ? c.name : ''}","${t ? t.model : ''}",`;
                csv += `"${formatDate(r.issue_date)}","${formatDate(r.planned_return)}","${formatDate(r.actual_return)}",`;
                csv += `"${r.price_per_day || 0}","${r.total_cost || 0}","${r.deposit || 0}","${r.deposit_returned ? 'Да' : 'Нет'}",`;
                csv += `"${r.return_condition || ''}","${r.comment || ''}","${r.status || ''}"\n`;
            });
            const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `аренды_${todayStr()}.csv`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(link.href);
            showToast('CSV скачан', 'success');
        };

            } else {
                document.getElementById('loginPage').classList.remove('hidden');
                document.getElementById('registerPage').classList.add('hidden');
                document.getElementById('mainApp').classList.add('hidden');
                document.getElementById('mainNav').style.display = 'none';
            }
        }

        // ===== ЗАПУСК =====
        checkSession();
        // ===== ВТОРАЯ ЧАСТЬ: АУДИТ, УЛУЧШЕННАЯ АНАЛИТИКА, РЕДАКТИРОВАНИЕ АРЕНДЫ =====

        // ---------- 1. АУДИТ (логирование действий) ----------
        async function logAction(action, details = {}) {
            try {
                const { data: { user } } = await supabase.auth.getUser();
                const userId = user ? user.id : 'anonymous';
                const logEntry = {
                    id: genId(),
                    user_id: userId,
                    user_email: user ? user.email : 'anonymous',
                    action: action,
                    details: details,
                    created_at: new Date().toISOString()
                };
                // Вставляем в таблицу audit_log (если она существует)
                const { error } = await supabase.from('audit_log').insert(logEntry);
                if (error) console.warn('Audit log error:', error);
            } catch (e) { console.warn('Audit log error:', e); }
        }

        // Переопределяем ключевые функции для логирования (без нарушения работы)
        const originalSaveTool = window._saveTool;
        window._saveTool = async function(e) {
            await originalSaveTool(e);
            await logAction('save_tool', { id: document.getElementById('fEditId').value || 'new' });
        };

        const originalDeleteTool = window._deleteTool;
        window._deleteTool = async function(id) {
            await originalDeleteTool(id);
            await logAction('delete_tool', { tool_id: id });
        };

        const originalSaveClient = window._saveClient;
        window._saveClient = async function(e) {
            await originalSaveClient(e);
            await logAction('save_client', { id: document.getElementById('fEditClientId').value || 'new' });
        };

        const originalDeleteClient = window._deleteClient;
        window._deleteClient = async function(id) {
            await originalDeleteClient(id);
            await logAction('delete_client', { client_id: id });
        };

        const originalSaveRental = window._saveRental;
        window._saveRental = async function(e) {
            await originalSaveRental(e);
            await logAction('create_rental', { client_id: document.getElementById('rClient').value, tool_id: document.getElementById('rTool').value });
        };

        const originalReturnRental = window._returnRental;
        window._returnRental = async function(sendToRepair) {
            const rentalId = document.getElementById('retRental').value;
            await originalReturnRental(sendToRepair);
            await logAction('return_rental', { rental_id: rentalId, send_to_repair: sendToRepair });
        };

        const originalBookingToRental = window._bookingToRental;
        window._bookingToRental = async function(rentalId) {
            await originalBookingToRental(rentalId);
            await logAction('booking_to_rental', { rental_id: rentalId });
        };

        const originalCancelBooking = window._cancelBooking;
        window._cancelBooking = async function(rentalId) {
            await originalCancelBooking(rentalId);
            await logAction('cancel_booking', { rental_id: rentalId });
        };

        const originalMassCloseRentals = window._massCloseRentals;
        window._massCloseRentals = async function() {
            const selected = document.querySelectorAll('.rental-checkbox:checked');
            const ids = Array.from(selected).map(cb => cb.dataset.id);
            await originalMassCloseRentals();
            await logAction('mass_close_rentals', { count: ids.length, ids: ids });
        };

        // ---------- 2. УЛУЧШЕННАЯ АНАЛИТИКА ----------
        // Добавляем блок "Топ клиентов" и "Динамика" на дашборд
        function renderTopClients() {
            const clientStats = {};
            rentals.filter(r => r.status === 'закрыта').forEach(r => {
                const client = getClientById(r.client_id);
                if (!client) return;
                if (!clientStats[client.id]) {
                    clientStats[client.id] = { name: client.name, total: 0, count: 0 };
                }
                clientStats[client.id].total += r.total_cost || 0;
                clientStats[client.id].count += 1;
            });
            const sorted = Object.values(clientStats).sort((a, b) => b.total - a.total).slice(0, 5);
            if (sorted.length === 0) return '<p class="text-muted">Нет данных по клиентам</p>';
            let html = '<div class="mt-4"><h5>🏆 Топ клиенты по выручке</h5><ul class="list-group">';
            sorted.forEach((c, i) => {
                html += `<li class="list-group-item d-flex justify-content-between align-items-center">
                    ${i+1}. ${c.name} <span class="badge bg-primary rounded-pill">${c.total} ₽ (${c.count} аренд)</span>
                </li>`;
            });
            html += '</ul></div>';
            return html;
        }

        function renderRevenueDynamics() {
            // Динамика по месяцам (последние 6 месяцев)
            const months = [];
            const now = new Date();
            for (let i = 5; i >= 0; i--) {
                const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
                const monthStr = d.toISOString().slice(0, 7); // YYYY-MM
                const revenue = rentals
                    .filter(r => r.status === 'закрыта' && r.actual_return && r.actual_return.startsWith(monthStr))
                    .reduce((sum, r) => sum + (r.total_cost || 0), 0);
                months.push({ month: monthStr, revenue });
            }
            if (months.every(m => m.revenue === 0)) return '<p class="text-muted">Нет данных за последние 6 месяцев</p>';
            let html = '<div class="mt-4"><h5>📈 Динамика выручки по месяцам</h5><ul class="list-group">';
            months.forEach(m => {
                const label = new Date(m.month + '-01').toLocaleDateString('ru-RU', { month: 'long', year: 'numeric' });
                html += `<li class="list-group-item d-flex justify-content-between align-items-center">
                    ${label} <span class="badge bg-success rounded-pill">${m.revenue} ₽</span>
                </li>`;
            });
            html += '</ul></div>';
            return html;
        }

        // Встраиваем блоки на дашборд (после графика)
        const originalRenderDashboard = renderDashboard;
        renderDashboard = function(container) {
            originalRenderDashboard(container);
            // После рендера добавляем блоки аналитики
            const chartContainer = container.querySelector('.chart-container');
            if (chartContainer) {
                const wrapper = document.createElement('div');
                wrapper.innerHTML = renderTopClients() + renderRevenueDynamics();
                chartContainer.parentNode.insertBefore(wrapper.firstElementChild, chartContainer.nextSibling);
                // Если внутри несколько элементов, вставляем по очереди
                const children = wrapper.children;
                while (children.length) {
                    chartContainer.parentNode.insertBefore(children[0], chartContainer.nextSibling);
                }
            }
        };

        // ---------- 3. РЕДАКТИРОВАНИЕ АРЕНДЫ ----------
        // Добавляем кнопку редактирования в активные аренды и брони
        window._editRental = function(rentalId) {
            const rental = rentals.find(r => r.id === rentalId);
            if (!rental) { showToast('Аренда не найдена', 'danger'); return; }
            if (rental.status !== 'активна' && rental.status !== 'забронирована') {
                showToast('Редактировать можно только активные аренды или брони', 'warning');
                return;
            }
            const container = document.getElementById('appContent');
            const clientsOpts = clients.map(c => `<option value="${c.id}" ${c.id === rental.client_id ? 'selected' : ''}>${c.name} (${c.phone})</option>`).join('');
            const toolsOpts = tools.map(t => `<option value="${t.id}" ${t.id === rental.tool_id ? 'selected' : ''}>${t.model} (${t.inventory_number})</option>`).join('');
            render(container, `
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h1>Редактировать аренду ${rental.rental_number}</h1>
                <button class="btn btn-secondary" onclick="goBack()"><i class="bi bi-arrow-left"></i> Назад</button>
            </div>
            <form onsubmit="window._saveRentalEdit(event, '${rentalId}')">
                <div class="mb-3">
                    <label>Клиент</label>
                    <select id="editClient" class="form-select" required>${clientsOpts}</select>
                </div>
                <div class="mb-3">
                    <label>Инструмент</label>
                    <select id="editTool" class="form-select" required>${toolsOpts}</select>
                </div>
                <div class="mb-3"><label>Дата выдачи</label><input id="editDate" type="date" class="form-control" value="${rental.issue_date}" required /></div>
                <div class="mb-3"><label>План возврата</label><input id="editReturn" type="date" class="form-control" value="${rental.planned_return}" required /></div>
                <div class="mb-3"><label>Цена за сутки (₽)</label><input id="editPrice" type="number" step="0.01" class="form-control" value="${rental.price_per_day}" required /></div>
                <div class="mb-3"><label>Комментарий</label><textarea id="editComment" class="form-control" rows="2">${rental.comment || ''}</textarea></div>
                <button type="submit" class="btn btn-success">Сохранить изменения</button>
                <button type="button" class="btn btn-secondary" onclick="navigate('activeRentals')">Отмена</button>
            </form>
            `);
        };

        window._saveRentalEdit = async function(e, rentalId) {
            e.preventDefault();
            const clientId = document.getElementById('editClient').value;
            const toolId = document.getElementById('editTool').value;
            const issueDate = document.getElementById('editDate').value;
            const plannedReturn = document.getElementById('editReturn').value;
            const pricePerDay = parseFloat(document.getElementById('editPrice').value) || 0;
            const comment = document.getElementById('editComment').value.trim();

            showSpinner();
            const { error } = await supabase.from('rentals').update({
                client_id: clientId,
                tool_id: toolId,
                issue_date: issueDate,
                planned_return: plannedReturn,
                price_per_day: pricePerDay,
                comment: comment
            }).eq('id', rentalId);
            if (error) { showToast('Ошибка обновления: ' + error.message, 'danger'); hideSpinner(); return; }
            await refreshAllData();
            hideSpinner();
            showToast('Аренда обновлена', 'success');
            await logAction('edit_rental', { rental_id: rentalId });
            navigate('activeRentals');
        };

        // Добавляем кнопки редактирования в таблицы активных аренд и броней
        // Переопределяем renderActiveRentals и renderBookings, чтобы добавить кнопку "Редактировать"
        const originalRenderActiveRentals = renderActiveRentals;
        renderActiveRentals = function(container) {
            originalRenderActiveRentals(container);
            // После рендера добавляем кнопку редактирования в каждую строку
            setTimeout(() => {
                const rows = container.querySelectorAll('.rental-checkbox');
                rows.forEach(cb => {
                    const row = cb.closest('tr');
                    if (row) {
                        const lastTd = row.querySelector('td:last-child');
                        if (lastTd) {
                            const editBtn = document.createElement('button');
                            editBtn.className = 'btn btn-sm btn-outline-primary ms-1';
                            editBtn.innerHTML = '✎';
                            editBtn.setAttribute('data-tooltip', 'Редактировать аренду');
                            editBtn.onclick = () => window._editRental(cb.dataset.id);
                            lastTd.appendChild(editBtn);
                        }
                    }
                });
            }, 50);
        };

        const originalRenderBookings = renderBookings;
        renderBookings = function(container) {
            originalRenderBookings(container);
            setTimeout(() => {
                const rows = container.querySelectorAll('table tbody tr');
                rows.forEach(row => {
                    const lastTd = row.querySelector('td:last-child');
                    if (lastTd) {
                        const editBtn = document.createElement('button');
                        editBtn.className = 'btn btn-sm btn-outline-primary ms-1';
                        editBtn.innerHTML = '✎';
                        editBtn.setAttribute('data-tooltip', 'Редактировать бронь');
                        const rentalId = row.querySelector('td:first-child')?.textContent?.trim(); // может быть номер, но лучше использовать data-id
                        // Ищем data-id через чекбокс? В бронях чекбоксов нет, поэтому найдём по номеру аренды
                        const rentalNumber = row.querySelector('td:first-child')?.textContent?.trim();
                        const rental = rentals.find(r => r.rental_number === rentalNumber);
                        if (rental) {
                            editBtn.onclick = () => window._editRental(rental.id);
                            lastTd.appendChild(editBtn);
                        }
                    }
                });
            }, 50);
        };

        // ---------- 4. УЛУЧШЕННЫЕ УВЕДОМЛЕНИЯ С АНИМАЦИЕЙ ----------
        // Переопределяем showToast для добавления анимации (уже есть)
        // Дополнительно можно добавить звук или иконки, но пока оставим как есть.

        // ---------- 5. ДОПОЛНИТЕЛЬНАЯ МЕТРИКА НА ДАШБОРД ----------
        // Добавляем карточку "Средняя выручка на аренду"
        const originalRenderDashboardMetrics = renderDashboard;
        renderDashboard = function(container) {
            originalRenderDashboardMetrics(container);
            // После рендера добавим ещё одну карточку в ряд метрик
            const row = container.querySelector('.row.mt-4.g-3');
            if (row) {
                const totalClosed = rentals.filter(r => r.status === 'закрыта').length;
                const totalRevenue = rentals.filter(r => r.status === 'закрыта').reduce((sum, r) => sum + (r.total_cost || 0), 0);
                const avg = totalClosed > 0 ? Math.round(totalRevenue / totalClosed) : 0;
                const card = document.createElement('div');
                card.className = 'col-md-4';
                card.innerHTML = `
                    <div class="card card-dashboard"><div class="card-body">
                        <h5>Средняя выручка на аренду</h5>
                        <h3>${avg} ₽</h3>
                        <small class="text-muted">закрытых аренд: ${totalClosed}</small>
                    </div></div>
                `;
                row.appendChild(card);
            }
        };
    })();
</script>
</body>
</html>
