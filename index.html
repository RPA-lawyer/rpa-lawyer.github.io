<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>СК Квадрант — Учёт аренды</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        body { padding-top: 70px; }
        .card-dashboard { transition: 0.2s; }
        .card-dashboard:hover { transform: translateY(-3px); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .navbar-brand { font-weight: 600; }
        .table-tools td { vertical-align: middle; }
        .rental-badge { font-size: 0.75rem; }
        .btn-edit { margin-right: 5px; }
        .login-container { max-width: 400px; margin: 50px auto; }
        .hidden { display: none; }
        .pointer { cursor: pointer; }
    </style>
</head>
<body>

<!-- НАВИГАЦИЯ -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top" id="mainNav">
    <div class="container">
        <span class="navbar-brand" style="cursor:default;">СК Квадрант</span>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav me-auto" id="navList">
                <li class="nav-item"><a class="nav-link active" href="#" data-page="dashboard">Дашборд</a></li>
                <li class="nav-item"><a class="nav-link" href="#" data-page="tools">Инструменты</a></li>
                <li class="nav-item"><a class="nav-link" href="#" data-page="clients">Клиенты</a></li>
                <li class="nav-item"><a class="nav-link" href="#" data-page="newRental">Выдать</a></li>
                <li class="nav-item"><a class="nav-link" href="#" data-page="activeRentals">Активные</a></li>
                <li class="nav-item"><a class="nav-link" href="#" data-page="returnRental">Вернуть</a></li>
                <li class="nav-item"><a class="nav-link" href="#" data-page="repair">🔧 ТО</a></li>
                <li class="nav-item"><a class="nav-link" href="#" data-page="history">📜 История</a></li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link" href="#" onclick="logout()">Выйти</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- ОСНОВНОЙ КОНТЕЙНЕР -->
<div class="container" id="app">
    <!-- Страница входа -->
    <div id="loginPage" class="login-container">
        <h2 class="text-center mb-4">Вход в систему</h2>
        <form onsubmit="login(event)">
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" id="loginEmail" class="form-control" required />
            </div>
            <div class="mb-3">
                <label class="form-label">Пароль</label>
                <input type="password" id="loginPassword" class="form-control" required />
            </div>
            <button type="submit" class="btn btn-primary w-100">Войти</button>
            <hr />
            <p class="text-center text-muted small">Нет аккаунта? <a href="#" onclick="showRegister()">Зарегистрируйтесь</a></p>
        </form>
    </div>

    <!-- Регистрация -->
    <div id="registerPage" class="login-container hidden">
        <h2 class="text-center mb-4">Регистрация</h2>
        <form onsubmit="register(event)">
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" id="regEmail" class="form-control" required />
            </div>
            <div class="mb-3">
                <label class="form-label">Пароль (минимум 6 символов)</label>
                <input type="password" id="regPassword" class="form-control" required minlength="6" />
            </div>
            <button type="submit" class="btn btn-success w-100">Зарегистрироваться</button>
            <hr />
            <p class="text-center text-muted small">Уже есть аккаунт? <a href="#" onclick="showLogin()">Войдите</a></p>
        </form>
    </div>

    <!-- Основной контент -->
    <div id="mainApp" class="hidden"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    (function() {
        'use strict';

        // ===== ВАШИ ДАННЫЕ SUPABASE =====
        const SUPABASE_URL = 'https://jptbqcbpllffgufusibj.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_gHL-E4wUy2KbNnwcnxj-Cw_pY5eaxth';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ----- ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ -----
        function genId() {
            return Date.now().toString(36) + Math.random().toString(36).substring(2, 8);
        }

        function getStatusColor(status) {
            const map = {
                'в наличии': 'success',
                'в аренде': 'warning',
                'на обслуживании': 'danger',
                'активна': 'warning',
                'закрыта': 'secondary',
                'просрочена': 'danger'
            };
            return map[status] || 'secondary';
        }

        function formatDate(dateStr) {
            if (!dateStr) return '—';
            const d = new Date(dateStr);
            return d.toLocaleDateString('ru-RU');
        }

        function todayStr() {
            return new Date().toISOString().split('T')[0];
        }

        // ----- ГЛОБАЛЬНЫЕ ДАННЫЕ -----
        let tools = [];
        let clients = [];
        let rentals = [];

        // ----- ЗАГРУЗКА ДАННЫХ -----
        async function loadTools() {
            const { data, error } = await supabase.from('tools').select('*');
            if (error) { console.error('Ошибка загрузки инструментов:', error); return []; }
            return data || [];
        }
        async function loadClients() {
            const { data, error } = await supabase.from('clients').select('*');
            if (error) { console.error('Ошибка загрузки клиентов:', error); return []; }
            return data || [];
        }
        async function loadRentals() {
            const { data, error } = await supabase.from('rentals').select('*');
            if (error) { console.error('Ошибка загрузки аренд:', error); return []; }
            return data || [];
        }
        async function refreshAllData() {
            [tools, clients, rentals] = await Promise.all([loadTools(), loadClients(), loadRentals()]);
        }

        function getToolById(id) { return tools.find(t => t.id === id); }
        function getClientById(id) { return clients.find(c => c.id === id); }

        // ----- НАВИГАЦИЯ -----
        function navigate(page) {
            document.querySelectorAll('#navList .nav-link').forEach(el => el.classList.remove('active'));
            const link = document.querySelector(`#navList .nav-link[data-page="${page}"]`);
            if (link) link.classList.add('active');
            switch (page) {
                case 'dashboard':       renderDashboard(); break;
                case 'tools':           renderTools(); break;
                case 'clients':         renderClients(); break;
                case 'newRental':       renderNewRental(); break;
                case 'activeRentals':   renderActiveRentals(); break;
                case 'returnRental':    renderReturnRental(); break;
                case 'repair':          renderRepair(); break;
                case 'history':         renderHistory(); break;
                default: renderDashboard();
            }
        }

        document.querySelector('#navList').addEventListener('click', function(e) {
            const link = e.target.closest('.nav-link');
            if (!link) return;
            const page = link.dataset.page;
            if (page) navigate(page);
        });

        function render(html) {
            document.getElementById('mainApp').innerHTML = html;
        }

        // ---------- ДАШБОРД ----------
        function renderDashboard() {
            const total = tools.length;
            const available = tools.filter(t => t.status === 'в наличии').length;
            const rented = tools.filter(t => t.status === 'в аренде').length;
            const maintenance = tools.filter(t => t.status === 'на обслуживании').length;
            const activeRentals = rentals.filter(r => r.status === 'активна').length;
            const today = todayStr();
            const revenueToday = rentals
                .filter(r => r.status === 'закрыта' && r.actual_return === today)
                .reduce((sum, r) => sum + (r.total_cost || 0), 0);
            const recent = [...rentals].sort((a, b) => (b.id || '').localeCompare(a.id || '')).slice(0, 5);

            let html = `
            <h1 class="mb-4">Дашборд</h1>
            <div class="row g-3">
                <div class="col-md-3"><div class="card text-bg-primary card-dashboard"><div class="card-body"><h5>Всего</h5><h2>${total}</h2></div></div></div>
                <div class="col-md-3"><div class="card text-bg-success card-dashboard"><div class="card-body"><h5>Свободно</h5><h2>${available}</h2></div></div></div>
                <div class="col-md-3"><div class="card text-bg-warning card-dashboard"><div class="card-body"><h5>В аренде</h5><h2>${rented}</h2></div></div></div>
                <div class="col-md-3"><div class="card text-bg-danger card-dashboard"><div class="card-body"><h5>На ТО</h5><h2>${maintenance}</h2></div></div></div>
            </div>
            <div class="row mt-4 g-3">
                <div class="col-md-4"><div class="card card-dashboard"><div class="card-body"><h5>Активных аренд</h5><h3>${activeRentals}</h3></div></div></div>
                <div class="col-md-4"><div class="card card-dashboard"><div class="card-body"><h5>Выручка сегодня</h5><h3>${revenueToday} ₽</h3></div></div></div>
            </div>
            <h4 class="mt-4">Последние аренды</h4>
            <div class="table-responsive">
            <table class="table table-striped table-hover">
                <thead><tr><th>№</th><th>Клиент</th><th>Инструмент</th><th>Выдача</th><th>Возврат (план)</th><th>Статус</th></tr></thead>
                <tbody>
            `;
            if (recent.length === 0) {
                html += `<tr><td colspan="6" class="text-center text-muted">Нет записей</td></tr>`;
            } else {
                recent.forEach(r => {
                    const client = getClientById(r.client_id);
                    const tool = getToolById(r.tool_id);
                    html += `
                    <tr>
                        <td>${r.rental_number || '—'}</td>
                        <td>${client ? client.name : 'Удалён'}</td>
                        <td>${tool ? tool.model : 'Удалён'}</td>
                        <td>${formatDate(r.issue_date)}</td>
                        <td>${formatDate(r.planned_return)}</td>
                        <td><span class="badge bg-${getStatusColor(r.status)} rental-badge">${r.status || '—'}</span></td>
                    </tr>
                    `;
                });
            }
            html += `</tbody></table></div>`;
            render(html);
        }

        // ---------- ИНСТРУМЕНТЫ ----------
        function renderTools() {
            let html = `
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h1>Инструменты</h1>
                <button class="btn btn-primary" onclick="window._addTool()">➕ Добавить</button>
            </div>
            <div class="table-responsive">
            <table class="table table-hover table-tools">
                <thead><tr><th>Инв. №</th><th>Категория</th><th>Модель</th><th>Цена/сутки</th><th>Залог</th><th>Статус</th><th>Действия</th></tr></thead>
                <tbody>
            `;
            if (tools.length === 0) {
                html += `<tr><td colspan="7" class="text-center text-muted">Нет инструментов</td></tr>`;
            } else {
                tools.forEach(t => {
                    html += `
                    <tr>
                        <td><strong>${t.inventory_number || '—'}</strong></td>
                        <td>${t.category || '—'}</td>
                        <td>${t.model || '—'}</td>
                        <td>${t.price_per_day || 0} ₽</td>
                        <td>${t.deposit || 0} ₽</td>
                        <td><span class="badge bg-${getStatusColor(t.status)} rental-badge">${t.status || '—'}</span></td>
                        <td>
                            <button class="btn btn-sm btn-outline-primary btn-edit" onclick="window._editTool('${t.id}')">✎</button>
                            <button class="btn btn-sm btn-outline-danger" onclick="window._deleteTool('${t.id}')">✕</button>
                        </td>
                    </tr>
                    `;
                });
            }
            html += `</tbody></table></div>`;
            render(html);
        }

        window._addTool = function() {
            render(`
            <h1>Добавить инструмент</h1>
            <form onsubmit="window._saveTool(event)">
                <div class="mb-3"><label class="form-label">Инв. номер</label><input id="fInv" class="form-control" required /></div>
                <div class="mb-3"><label class="form-label">Категория</label><input id="fCat" class="form-control" required /></div>
                <div class="mb-3"><label class="form-label">Модель</label><input id="fModel" class="form-control" required /></div>
                <div class="mb-3"><label class="form-label">Цена за сутки (₽)</label><input id="fPrice" type="number" step="0.01" class="form-control" required /></div>
                <div class="mb-3"><label class="form-label">Залог (₽)</label><input id="fDeposit" type="number" step="0.01" class="form-control" required /></div>
                <input type="hidden" id="fEditId" value="" />
                <button type="submit" class="btn btn-success">Сохранить</button>
                <button type="button" class="btn btn-secondary" onclick="navigate('tools')">Отмена</button>
            </form>
            `);
        };

        window._editTool = function(id) {
            const tool = getToolById(id);
            if (!tool) return;
            render(`
            <h1>Редактировать инструмент</h1>
            <form onsubmit="window._saveTool(event)">
                <div class="mb-3"><label class="form-label">Инв. номер</label><input id="fInv" class="form-control" value="${tool.inventory_number || ''}" required /></div>
                <div class="mb-3"><label class="form-label">Категория</label><input id="fCat" class="form-control" value="${tool.category || ''}" required /></div>
                <div class="mb-3"><label class="form-label">Модель</label><input id="fModel" class="form-control" value="${tool.model || ''}" required /></div>
                <div class="mb-3"><label class="form-label">Цена за сутки (₽)</label><input id="fPrice" type="number" step="0.01" class="form-control" value="${tool.price_per_day || 0}" required /></div>
                <div class="mb-3"><label class="form-label">Залог (₽)</label><input id="fDeposit" type="number" step="0.01" class="form-control" value="${tool.deposit || 0}" required /></div>
                <input type="hidden" id="fEditId" value="${id}" />
                <button type="submit" class="btn btn-success">Обновить</button>
                <button type="button" class="btn btn-secondary" onclick="navigate('tools')">Отмена</button>
            </form>
            `);
        };

        window._saveTool = async function(e) {
            e.preventDefault();
            const id = document.getElementById('fEditId').value;
            const data = {
                inventory_number: document.getElementById('fInv').value.trim(),
                category: document.getElementById('fCat').value.trim(),
                model: document.getElementById('fModel').value.trim(),
                price_per_day: parseFloat(document.getElementById('fPrice').value) || 0,
                deposit: parseFloat(document.getElementById('fDeposit').value) || 0,
            };
            if (id) {
                const { error } = await supabase.from('tools').update(data).eq('id', id);
                if (error) { alert('Ошибка обновления: ' + error.message); return; }
            } else {
                const newTool = { id: genId(), ...data, status: 'в наличии', repair_reason: '', repair_date: null };
                const { error } = await supabase.from('tools').insert(newTool);
                if (error) { alert('Ошибка добавления: ' + error.message); return; }
            }
            await refreshAllData();
            navigate('tools');
        };

        window._deleteTool = async function(id) {
            if (!confirm('Удалить инструмент?')) return;
            const { error } = await supabase.from('tools').delete().eq('id', id);
            if (error) { alert('Ошибка удаления: ' + error.message); return; }
            await refreshAllData();
            navigate('tools');
        };

        // ---------- КЛИЕНТЫ (с историей) ----------
        function renderClients() {
            let html = `
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h1>Клиенты</h1>
                <button class="btn btn-primary" onclick="window._addClient()">➕ Добавить</button>
            </div>
            <div class="table-responsive">
            <table class="table table-hover">
                <thead><tr><th>Имя</th><th>Телефон</th><th>Email</th><th>Аренд</th><th>Действия</th></tr></thead>
                <tbody>
            `;
            if (clients.length === 0) {
                html += `<tr><td colspan="5" class="text-center text-muted">Нет клиентов</td></tr>`;
            } else {
                clients.forEach(c => {
                    const count = rentals.filter(r => r.client_id === c.id).length;
                    html += `
                    <tr>
                        <td><strong>${c.name || '—'}</strong></td>
                        <td>${c.phone || '—'}</td>
                        <td>${c.email || '—'}</td>
                        <td>${count}</td>
                        <td>
                            <button class="btn btn-sm btn-outline-info btn-edit" onclick="window._showClientHistory('${c.id}')">📋 История</button>
                            <button class="btn btn-sm btn-outline-primary btn-edit" onclick="window._editClient('${c.id}')">✎</button>
                            <button class="btn btn-sm btn-outline-danger" onclick="window._deleteClient('${c.id}')">✕</button>
                        </td>
                    </tr>
                    `;
                });
            }
            html += `</tbody></table></div>`;
            render(html);
        }

        // Показать историю аренд конкретного клиента
        window._showClientHistory = function(clientId) {
            const client = getClientById(clientId);
            if (!client) return;
            const clientRentals = rentals.filter(r => r.client_id === clientId)
                .sort((a, b) => (b.id || '').localeCompare(a.id || ''));

            let html = `
            <h1>История аренд: ${client.name}</h1>
            <p><strong>Телефон:</strong> ${client.phone || '—'} &nbsp; <strong>Email:</strong> ${client.email || '—'}</p>
            <button class="btn btn-secondary mb-3" onclick="navigate('clients')">← Назад к клиентам</button>
            <div class="table-responsive">
            <table class="table table-striped table-hover">
                <thead><tr>
                    <th>№</th>
                    <th>Инструмент</th>
                    <th>Выдача</th>
                    <th>План возврат</th>
                    <th>Факт возврат</th>
                    <th>Цена/сутки</th>
                    <th>Сумма</th>
                    <th>Состояние</th>
                    <th>Статус</th>
                </tr></thead>
                <tbody>
            `;
            if (clientRentals.length === 0) {
                html += `<tr><td colspan="9" class="text-center text-muted">У клиента нет аренд</td></tr>`;
            } else {
                clientRentals.forEach(r => {
                    const tool = getToolById(r.tool_id);
                    html += `
                    <tr>
                        <td>${r.rental_number || '—'}</td>
                        <td>${tool ? tool.model : 'Удалён'}</td>
                        <td>${formatDate(r.issue_date)}</td>
                        <td>${formatDate(r.planned_return)}</td>
                        <td>${formatDate(r.actual_return)}</td>
                        <td>${r.price_per_day || 0} ₽</td>
                        <td>${r.total_cost || 0} ₽</td>
                        <td>${r.return_condition || '—'}</td>
                        <td><span class="badge bg-${getStatusColor(r.status)} rental-badge">${r.status || '—'}</span></td>
                    </tr>
                    `;
                });
            }
            html += `</tbody></table></div>`;
            render(html);
        };

        window._addClient = function() {
            render(`
            <h1>Добавить клиента</h1>
            <form onsubmit="window._saveClient(event)">
                <div class="mb-3"><label class="form-label">ФИО / Организация</label><input id="fName" class="form-control" required /></div>
                <div class="mb-3"><label class="form-label">Телефон</label><input id="fPhone" class="form-control" required /></div>
                <div class="mb-3"><label class="form-label">Email</label><input id="fEmail" class="form-control" /></div>
                <input type="hidden" id="fEditClientId" value="" />
                <button type="submit" class="btn btn-success">Сохранить</button>
                <button type="button" class="btn btn-secondary" onclick="navigate('clients')">Отмена</button>
            </form>
            `);
        };

        window._editClient = function(id) {
            const client = getClientById(id);
            if (!client) return;
            render(`
            <h1>Редактировать клиента</h1>
            <form onsubmit="window._saveClient(event)">
                <div class="mb-3"><label class="form-label">ФИО / Организация</label><input id="fName" class="form-control" value="${client.name || ''}" required /></div>
                <div class="mb-3"><label class="form-label">Телефон</label><input id="fPhone" class="form-control" value="${client.phone || ''}" required /></div>
                <div class="mb-3"><label class="form-label">Email</label><input id="fEmail" class="form-control" value="${client.email || ''}" /></div>
                <input type="hidden" id="fEditClientId" value="${id}" />
                <button type="submit" class="btn btn-success">Обновить</button>
                <button type="button" class="btn btn-secondary" onclick="navigate('clients')">Отмена</button>
            </form>
            `);
        };

        window._saveClient = async function(e) {
            e.preventDefault();
            const id = document.getElementById('fEditClientId').value;
            const data = {
                name: document.getElementById('fName').value.trim(),
                phone: document.getElementById('fPhone').value.trim(),
                email: document.getElementById('fEmail').value.trim()
            };
            if (id) {
                const { error } = await supabase.from('clients').update(data).eq('id', id);
                if (error) { alert('Ошибка обновления: ' + error.message); return; }
            } else {
                const newClient = { id: genId(), ...data };
                const { error } = await supabase.from('clients').insert(newClient);
                if (error) { alert('Ошибка добавления: ' + error.message); return; }
            }
            await refreshAllData();
            navigate('clients');
        };

        window._deleteClient = async function(id) {
            if (!confirm('Удалить клиента?')) return;
            const hasActive = rentals.some(r => r.client_id === id && r.status === 'активна');
            if (hasActive) {
                alert('Нельзя удалить клиента с активной арендой');
                return;
            }
            const { error } = await supabase.from('clients').delete().eq('id', id);
            if (error) { alert('Ошибка удаления: ' + error.message); return; }
            await refreshAllData();
            navigate('clients');
        };

        // ---------- ВЫДАТЬ ----------
        function renderNewRental() {
            const clientOpts = clients.map(c =>
                `<option value="${c.id}">${c.name} (${c.phone})</option>`
            ).join('');
            const toolOpts = tools.filter(t => t.status === 'в наличии')
                .map(t =>
                    `<option value="${t.id}">${t.model} (${t.inventory_number}) — ${t.price_per_day}₽/сут</option>`
                ).join('');
            const today = todayStr();

            render(`
            <h1>Оформить аренду</h1>
            <form onsubmit="window._saveRental(event)">
                <div class="mb-3">
                    <label class="form-label">Клиент</label>
                    <select id="rClient" class="form-select" required>
                        <option value="">— Выберите —</option>
                        ${clientOpts}
                    </select>
                    <small><a href="#" onclick="window._addClient(); return false;">➕ Добавить нового клиента</a></small>
                </div>
                <div class="mb-3">
                    <label class="form-label">Инструмент</label>
                    <select id="rTool" class="form-select" required>
                        <option value="">— Выберите —</option>
                        ${toolOpts}
                    </select>
                </div>
                <div class="mb-3"><label class="form-label">Дата выдачи</label><input id="rDate" type="date" class="form-control" value="${today}" required /></div>
                <div class="mb-3"><label class="form-label">Количество дней</label><input id="rDays" type="number" class="form-control" value="1" min="1" required /></div>
                <button type="submit" class="btn btn-success">Выдать</button>
                <button type="button" class="btn btn-secondary" onclick="navigate('dashboard')">Отмена</button>
            </form>
            `);
        }

        window._saveRental = async function(e) {
            e.preventDefault();
            const clientId = document.getElementById('rClient').value;
            const toolId = document.getElementById('rTool').value;
            const days = parseInt(document.getElementById('rDays').value) || 1;
            const issueDate = document.getElementById('rDate').value;

            if (!clientId) { alert('Выберите клиента'); return; }
            if (!toolId) { alert('Выберите инструмент'); return; }

            const tool = getToolById(toolId);
            if (!tool || tool.status !== 'в наличии') {
                alert('Инструмент недоступен');
                return;
            }

            const planned = new Date(issueDate);
            planned.setDate(planned.getDate() + days);

            const rental = {
                id: genId(),
                rental_number: 'AR-' + Date.now().toString(36).toUpperCase(),
                client_id: clientId,
                tool_id: toolId,
                issue_date: issueDate,
                planned_return: planned.toISOString().split('T')[0],
                actual_return: null,
                price_per_day: tool.price_per_day,
                total_cost: tool.price_per_day * days,
                deposit: tool.deposit,
                status: 'активна',
                return_condition: ''
            };

            const { error: toolError } = await supabase.from('tools').update({ status: 'в аренде' }).eq('id', toolId);
            if (toolError) { alert('Ошибка обновления инструмента: ' + toolError.message); return; }

            const { error: rentalError } = await supabase.from('rentals').insert(rental);
            if (rentalError) { alert('Ошибка создания аренды: ' + rentalError.message); return; }

            await refreshAllData();
            navigate('dashboard');
        };

        // ---------- АКТИВНЫЕ АРЕНДЫ (подробно) ----------
        function renderActiveRentals() {
            const active = rentals.filter(r => r.status === 'активна');
            let html = `
            <h1>Активные аренды</h1>
            <p class="text-muted">Всего активных: ${active.length}</p>
            <div class="table-responsive">
            <table class="table table-striped table-hover">
                <thead><tr>
                    <th>№</th>
                    <th>Клиент</th>
                    <th>Инструмент</th>
                    <th>Цена/сутки</th>
                    <th>Выдача</th>
                    <th>План возврат</th>
                    <th>Дней</th>
                    <th>Сумма</th>
                    <th>Статус</th>
                </tr></thead>
                <tbody>
            `;
            if (active.length === 0) {
                html += `<tr><td colspan="9" class="text-center text-muted">Нет активных аренд</td></tr>`;
            } else {
                active.forEach(r => {
                    const client = getClientById(r.client_id);
                    const tool = getToolById(r.tool_id);
                    const days = Math.ceil((new Date(r.planned_return) - new Date(r.issue_date)) / (1000*60*60*24));
                    html += `
                    <tr>
                        <td>${r.rental_number || '—'}</td>
                        <td>${client ? client.name : 'Удалён'}</td>
                        <td>${tool ? tool.model : 'Удалён'}</td>
                        <td>${r.price_per_day || 0} ₽</td>
                        <td>${formatDate(r.issue_date)}</td>
                        <td>${formatDate(r.planned_return)}</td>
                        <td>${days}</td>
                        <td>${r.total_cost || 0} ₽</td>
                        <td><span class="badge bg-${getStatusColor(r.status)} rental-badge">${r.status || '—'}</span></td>
                    </tr>
                    `;
                });
            }
            html += `</tbody></table></div>
            <button class="btn btn-secondary mt-3" onclick="navigate('dashboard')">На главную</button>
            `;
            render(html);
        }

        // ---------- ВОЗВРАТ ----------
        function renderReturnRental() {
            const active = rentals.filter(r => r.status === 'активна');
            let opts = active.map(r => {
                const client = getClientById(r.client_id);
                const tool = getToolById(r.tool_id);
                const label = `${r.rental_number} — ${tool ? tool.model : 'Удалён'} (${client ? client.name : 'Удалён'})`;
                return `<option value="${r.id}">${label}</option>`;
            }).join('');
            const today = todayStr();

            let html = `
            <h1>Возврат инструмента</h1>
            ${active.length === 0
                ? '<div class="alert alert-info">Нет активных аренд.</div>'
                : `
            <form onsubmit="return false;">
                <div class="mb-3">
                    <label class="form-label">Активная аренда</label>
                    <select id="retRental" class="form-select" required>
                        <option value="">— Выберите —</option>
                        ${opts}
                    </select>
                </div>
                <div class="mb-3"><label class="form-label">Фактическая дата возврата</label><input id="retDate" type="date" class="form-control" value="${today}" required /></div>
                <div class="mb-3">
                    <label class="form-label">Состояние инструмента</label>
                    <select id="retCondition" class="form-select">
                        <option value="Отличное">Отличное</option>
                        <option value="Хорошее" selected>Хорошее</option>
                        <option value="Требует ремонта">Требует ремонта</option>
                        <option value="Неисправен">Неисправен</option>
                    </select>
                </div>
                <div class="mb-3">
                    <button type="button" class="btn btn-success" onclick="window._returnRental(false)">Принять возврат</button>
                    <button type="button" class="btn btn-warning" onclick="window._returnRental(true)">Отправить на ТО</button>
                </div>
            </form>
            `}
            <button class="btn btn-secondary mt-3" onclick="navigate('dashboard')">На главную</button>
            `;
            render(html);
        }

        window._returnRental = async function(sendToRepair) {
            const rentalId = document.getElementById('retRental').value;
            const actualReturn = document.getElementById('retDate').value;
            const condition = document.getElementById('retCondition') ? document.getElementById('retCondition').value : 'Хорошее';
            if (!rentalId) { alert('Выберите аренду'); return; }

            const rental = rentals.find(r => r.id === rentalId);
            if (!rental) return;

            const planned = new Date(rental.planned_return);
            const actual = new Date(actualReturn);
            let totalCost = rental.total_cost;
            if (actual > planned) {
                const extraDays = Math.ceil((actual - planned) / (1000 * 60 * 60 * 24));
                totalCost += extraDays * rental.price_per_day;
            }

            const { error: rentalError } = await supabase.from('rentals').update({
                actual_return: actualReturn,
                status: 'закрыта',
                return_condition: condition,
                total_cost: totalCost
            }).eq('id', rentalId);
            if (rentalError) { alert('Ошибка обновления аренды: ' + rentalError.message); return; }

            const toolId = rental.tool_id;
            const toolUpdate = sendToRepair
                ? { status: 'на обслуживании', repair_reason: condition, repair_date: actualReturn }
                : { status: 'в наличии', repair_reason: '', repair_date: null };
            const { error: toolError } = await supabase.from('tools').update(toolUpdate).eq('id', toolId);
            if (toolError) { alert('Ошибка обновления инструмента: ' + toolError.message); return; }

            await refreshAllData();
            navigate('dashboard');
        };

        // ---------- ТО ----------
        function renderRepair() {
            const repairTools = tools.filter(t => t.status === 'на обслуживании');
            let html = `
            <h1>🔧 Инструменты на ТО</h1>
            ${repairTools.length === 0
                ? '<div class="alert alert-info">Нет инструментов на ТО.</div>'
                : `
            <div class="table-responsive">
            <table class="table table-hover">
                <thead><tr><th>Инв. №</th><th>Модель</th><th>Причина</th><th>Дата отправки</th><th>Действие</th></tr></thead>
                <tbody>
            `}
            `;
            repairTools.forEach(t => {
                html += `
                <tr>
                    <td>${t.inventory_number || '—'}</td>
                    <td>${t.model || '—'}</td>
                    <td>${t.repair_reason || '—'}</td>
                    <td>${formatDate(t.repair_date)}</td>
                    <td><button class="btn btn-sm btn-success" onclick="window._returnFromRepair('${t.id}')">Вернуть с ТО</button></td>
                </tr>
                `;
            });
            if (repairTools.length > 0) {
                html += `</tbody></table></div>`;
            }
            render(html);
        }

        window._returnFromRepair = async function(toolId) {
            if (!confirm('Вернуть инструмент с ТО в наличие?')) return;
            const { error } = await supabase.from('tools').update({
                status: 'в наличии',
                repair_reason: '',
                repair_date: null
            }).eq('id', toolId);
            if (error) { alert('Ошибка: ' + error.message); return; }
            await refreshAllData();
            navigate('repair');
        };

        // ---------- ОБЩАЯ ИСТОРИЯ ----------
        function renderHistory() {
            const filter = document.getElementById('historyFilter') ? document.getElementById('historyFilter').value : 'all';
            let filtered = rentals;
            if (filter === 'active') filtered = rentals.filter(r => r.status === 'активна');
            else if (filter === 'closed') filtered = rentals.filter(r => r.status === 'закрыта');

            const sorted = [...filtered].sort((a, b) => (b.id || '').localeCompare(a.id || ''));

            let html = `
            <h1>📜 История аренд</h1>
            <div class="row mb-3">
                <div class="col-md-4">
                    <select id="historyFilter" class="form-select" onchange="renderHistory()">
                        <option value="all" ${filter === 'all' ? 'selected' : ''}>Все</option>
                        <option value="active" ${filter === 'active' ? 'selected' : ''}>Активные</option>
                        <option value="closed" ${filter === 'closed' ? 'selected' : ''}>Закрытые</option>
                    </select>
                </div>
            </div>
            <div class="table-responsive">
            <table class="table table-striped table-hover">
                <thead><tr>
                    <th>№</th>
                    <th>Клиент</th>
                    <th>Инструмент</th>
                    <th>Выдача</th>
                    <th>План возврат</th>
                    <th>Факт возврат</th>
                    <th>Сумма</th>
                    <th>Состояние</th>
                    <th>Статус</th>
                    <th>Действие</th>
                </tr></thead>
                <tbody>
            `;
            if (sorted.length === 0) {
                html += `<tr><td colspan="10" class="text-center text-muted">Нет записей</td></tr>`;
            } else {
                sorted.forEach(r => {
                    const client = getClientById(r.client_id);
                    const tool = getToolById(r.tool_id);
                    const canDelete = r.status !== 'активна';
                    html += `
                    <tr>
                        <td>${r.rental_number || '—'}</td>
                        <td>${client ? client.name : 'Удалён'}</td>
                        <td>${tool ? tool.model : 'Удалён'}</td>
                        <td>${formatDate(r.issue_date)}</td>
                        <td>${formatDate(r.planned_return)}</td>
                        <td>${formatDate(r.actual_return)}</td>
                        <td>${r.total_cost || 0} ₽</td>
                        <td>${r.return_condition || '—'}</td>
                        <td><span class="badge bg-${getStatusColor(r.status)} rental-badge">${r.status || '—'}</span></td>
                        <td>
                            ${canDelete ? `<button class="btn btn-sm btn-outline-danger" onclick="window._deleteRental('${r.id}')">🗑</button>` : '<span class="text-muted">—</span>'}
                        </td>
                    </tr>
                    `;
                });
            }
            html += `</tbody></table></div>`;
            render(html);
        }

        window._deleteRental = async function(rentalId) {
            if (!confirm('Удалить эту аренду? Это действие необратимо.')) return;
            const rental = rentals.find(r => r.id === rentalId);
            if (!rental) return;
            if (rental.status === 'активна') {
                alert('Нельзя удалить активную аренду. Сначала верните инструмент.');
                return;
            }
            const { error } = await supabase.from('rentals').delete().eq('id', rentalId);
            if (error) { alert('Ошибка удаления: ' + error.message); return; }
            await refreshAllData();
            renderHistory();
        };

        // ---------- АВТОРИЗАЦИЯ ----------
        window.login = async function(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const { data, error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) {
                alert('Ошибка входа: ' + error.message);
                return;
            }
            if (data.user) {
                document.getElementById('loginPage').classList.add('hidden');
                document.getElementById('registerPage').classList.add('hidden');
                document.getElementById('mainApp').classList.remove('hidden');
                document.getElementById('mainNav').style.display = 'flex';
                await refreshAllData();
                navigate('dashboard');
            }
        };

        window.register = async function(e) {
            e.preventDefault();
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            const { data, error } = await supabase.auth.signUp({ email, password });
            if (error) {
                alert('Ошибка регистрации: ' + error.message);
                return;
            }
            alert('Регистрация успешна! Теперь войдите.');
            showLogin();
        };

        window.logout = async function() {
            await supabase.auth.signOut();
            document.getElementById('loginPage').classList.remove('hidden');
            document.getElementById('registerPage').classList.add('hidden');
            document.getElementById('mainApp').classList.add('hidden');
            document.getElementById('mainNav').style.display = 'none';
            tools = [];
            clients = [];
            rentals = [];
        };

        window.showRegister = function() {
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('registerPage').classList.remove('hidden');
        };

        window.showLogin = function() {
            document.getElementById('registerPage').classList.add('hidden');
            document.getElementById('loginPage').classList.remove('hidden');
        };

        // ---------- ПРОВЕРКА СЕССИИ ----------
        async function checkSession() {
            const { data: { user } } = await supabase.auth.getUser();
            if (user) {
                document.getElementById('loginPage').classList.add('hidden');
                document.getElementById('registerPage').classList.add('hidden');
                document.getElementById('mainApp').classList.remove('hidden');
                document.getElementById('mainNav').style.display = 'flex';
                await refreshAllData();
                navigate('dashboard');
            } else {
                document.getElementById('loginPage').classList.remove('hidden');
                document.getElementById('registerPage').classList.add('hidden');
                document.getElementById('mainApp').classList.add('hidden');
                document.getElementById('mainNav').style.display = 'none';
            }
        }

        // ----- СТАРТ -----
        checkSession();
    })();
</script>
</body>
</html>
