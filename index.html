<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>СК Квадрант — Учёт аренды</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        body { padding-top: 70px; }
        .card-dashboard { transition: 0.2s; }
        .card-dashboard:hover { transform: translateY(-3px); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .navbar-brand { font-weight: 600; }
        .rental-badge { font-size: 0.75rem; }
        .btn-edit { margin-right: 5px; }
        .login-container { max-width: 400px; margin: 50px auto; }
        .hidden { display: none; }
        .chart-container {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
        }
        .chart-bar {
            display: flex;
            align-items: flex-end;
            height: 120px;
            gap: 6px;
            padding-top: 10px;
        }
        .chart-bar-item {
            flex: 1;
            background: #0d6efd;
            min-height: 4px;
            border-radius: 3px 3px 0 0;
            transition: 0.3s;
            position: relative;
        }
        .chart-bar-item:hover .tooltip-text { display: block; }
        .chart-bar-item .tooltip-text {
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: #fff;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            white-space: nowrap;
            display: none;
        }
        .chart-label {
            font-size: 10px;
            text-align: center;
            margin-top: 4px;
            color: #6c757d;
        }
        .filter-section {
            background: #f8f9fa;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<!-- НАВИГАЦИЯ -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top" id="mainNav">
    <div class="container">
        <span class="navbar-brand" style="cursor:default;">СК Квадрант</span>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav me-auto" id="navList">
                <li class="nav-item"><a class="nav-link active" href="#" data-page="dashboard">Дашборд</a></li>
                <li class="nav-item"><a class="nav-link" href="#" data-page="tools">Инструменты</a></li>
                <li class="nav-item"><a class="nav-link" href="#" data-page="clients">Клиенты</a></li>
                <li class="nav-item"><a class="nav-link" href="#" data-page="newRental">Выдать</a></li>
                <li class="nav-item"><a class="nav-link" href="#" data-page="activeRentals">Активные</a></li>
                <li class="nav-item"><a class="nav-link" href="#" data-page="bookings">Брони</a></li>
                <li class="nav-item"><a class="nav-link" href="#" data-page="returnRental">Вернуть</a></li>
                <li class="nav-item"><a class="nav-link" href="#" data-page="repair">🔧 ТО</a></li>
                <li class="nav-item"><a class="nav-link" href="#" data-page="history">📜 История</a></li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link" href="#" onclick="logout()">Выйти</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- ОСНОВНОЙ КОНТЕЙНЕР -->
<div class="container" id="app">
    <div id="loginPage" class="login-container">
        <h2 class="text-center mb-4">Вход</h2>
        <form onsubmit="login(event)">
            <div class="mb-3"><label class="form-label">Email</label><input type="email" id="loginEmail" class="form-control" required /></div>
            <div class="mb-3"><label class="form-label">Пароль</label><input type="password" id="loginPassword" class="form-control" required /></div>
            <button type="submit" class="btn btn-primary w-100">Войти</button>
            <hr />
            <p class="text-center text-muted small">Нет аккаунта? <a href="#" onclick="showRegister()">Зарегистрируйтесь</a></p>
        </form>
    </div>
    <div id="registerPage" class="login-container hidden">
        <h2 class="text-center mb-4">Регистрация</h2>
        <form onsubmit="register(event)">
            <div class="mb-3"><label class="form-label">Email</label><input type="email" id="regEmail" class="form-control" required /></div>
            <div class="mb-3"><label class="form-label">Пароль (≥6 символов)</label><input type="password" id="regPassword" class="form-control" required minlength="6" /></div>
            <button type="submit" class="btn btn-success w-100">Зарегистрироваться</button>
            <hr />
            <p class="text-center text-muted small">Уже есть аккаунт? <a href="#" onclick="showLogin()">Войдите</a></p>
        </form>
    </div>
    <div id="mainApp" class="hidden"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    (function() {
        'use strict';

        const SUPABASE_URL = 'https://jptbqcbpllffgufusibj.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_gHL-E4wUy2KbNnwcnxj-Cw_pY5eaxth';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ----- ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ -----
        function genId() { return Date.now().toString(36) + Math.random().toString(36).substring(2, 8); }

        function getStatusColor(status) {
            const map = {
                'в наличии': 'success', 'в аренде': 'warning', 'на обслуживании': 'danger',
                'забронирован': 'info', 'активна': 'warning', 'закрыта': 'secondary',
                'просрочена': 'danger', 'забронирована': 'info'
            };
            return map[status] || 'secondary';
        }

        function formatDate(dateStr) { if (!dateStr) return '—'; return new Date(dateStr).toLocaleDateString('ru-RU'); }
        function formatDateShort(dateStr) { if (!dateStr) return '—'; return new Date(dateStr).toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' }); }
        function todayStr() { return new Date().toISOString().split('T')[0]; }
        function daysBetween(date1, date2) { return Math.ceil((new Date(date2) - new Date(date1)) / (1000*60*60*24)); }

        let tools = [], clients = [], rentals = [];

        async function loadTools() { const { data, error } = await supabase.from('tools').select('*'); if (error) { console.error(error); return []; } return data || []; }
        async function loadClients() { const { data, error } = await supabase.from('clients').select('*'); if (error) { console.error(error); return []; } return data || []; }
        async function loadRentals() { const { data, error } = await supabase.from('rentals').select('*'); if (error) { console.error(error); return []; } return data || []; }
        async function refreshAllData() { [tools, clients, rentals] = await Promise.all([loadTools(), loadClients(), loadRentals()]); }

        function getToolById(id) { return tools.find(t => t.id === id); }
        function getClientById(id) { return clients.find(c => c.id === id); }

        // ----- НАВИГАЦИЯ -----
        function navigate(page) {
            document.querySelectorAll('#navList .nav-link').forEach(el => el.classList.remove('active'));
            const link = document.querySelector(`#navList .nav-link[data-page="${page}"]`);
            if (link) link.classList.add('active');

            switch (page) {
                case 'dashboard':       renderDashboard(); break;
                case 'tools':           renderTools(); break;
                case 'clients':         renderClients(); break;
                case 'newRental':       renderNewRental(); break;
                case 'activeRentals':   renderActiveRentals(); break;
                case 'bookings':        renderBookings(); break;
                case 'returnRental':    renderReturnRental(); break;
                case 'repair':          renderRepair(); break;
                case 'history':         renderHistory(); break;
                default: renderDashboard();
            }
        }

        document.querySelector('#navList').addEventListener('click', function(e) {
            const link = e.target.closest('.nav-link');
            if (!link) return;
            const page = link.dataset.page;
            if (page) navigate(page);
        });

        function render(html) { document.getElementById('mainApp').innerHTML = html; }

        // ---------- ДАШБОРД ----------
        function renderDashboard() {
            const total = tools.length;
            const available = tools.filter(t => t.status === 'в наличии').length;
            const rented = tools.filter(t => t.status === 'в аренде').length;
            const maintenance = tools.filter(t => t.status === 'на обслуживании').length;
            const reserved = tools.filter(t => t.status === 'забронирован').length;
            const activeRentals = rentals.filter(r => r.status === 'активна').length;
            const bookings = rentals.filter(r => r.status === 'забронирована').length;
            const today = todayStr();
            const revenueToday = rentals.filter(r => r.status === 'закрыта' && r.actual_return === today).reduce((sum, r) => sum + (r.total_cost || 0), 0);
            const totalDeposits = rentals.filter(r => r.status === 'закрыта' && !r.deposit_returned).reduce((sum, r) => sum + (r.deposit || 0), 0);

            const todayDate = new Date(today);
            const overdue = rentals.filter(r => r.status === 'активна' && new Date(r.planned_return) < todayDate);
            const returningSoon = rentals.filter(r => r.status === 'активна' && (daysBetween(today, r.planned_return) >= 0 && daysBetween(today, r.planned_return) <= 2));

            const chartData = [];
            for (let i = 6; i >= 0; i--) {
                const d = new Date(today); d.setDate(d.getDate() - i);
                const dateStr = d.toISOString().split('T')[0];
                const dayRevenue = rentals.filter(r => r.status === 'закрыта' && r.actual_return === dateStr).reduce((sum, r) => sum + (r.total_cost || 0), 0);
                chartData.push({ date: dateStr, revenue: dayRevenue });
            }
            const maxRevenue = Math.max(...chartData.map(d => d.revenue), 1);

            const recent = [...rentals].filter(r => r.status !== 'забронирована').sort((a, b) => (b.id || '').localeCompare(a.id || '')).slice(0, 5);

            let html = `
            <h1 class="mb-4">Дашборд</h1>
            <div class="row g-3 mb-4">
                ${overdue.length > 0 ? `
                <div class="col-md-6">
                    <div class="card text-bg-danger">
                        <div class="card-body">
                            <h5>⚠️ Просрочено: ${overdue.length}</h5>
                            <p class="small mb-0">${overdue.map(r => { const c = getClientById(r.client_id); const t = getToolById(r.tool_id); return `${c ? c.name : '—'} (${t ? t.model : '—'})`; }).join(', ')}</p>
                            <a href="#" onclick="navigate('activeRentals')" class="btn btn-sm btn-light mt-2">Посмотреть</a>
                        </div>
                    </div>
                </div>
                ` : ''}
                ${returningSoon.length > 0 ? `
                <div class="col-md-6">
                    <div class="card text-bg-warning">
                        <div class="card-body">
                            <h5>🔄 Скоро возврат: ${returningSoon.length}</h5>
                            <p class="small mb-0">${returningSoon.map(r => { const c = getClientById(r.client_id); const t = getToolById(r.tool_id); return `${c ? c.name : '—'} (${t ? t.model : '—'})`; }).join(', ')}</p>
                            <a href="#" onclick="navigate('activeRentals')" class="btn btn-sm btn-dark mt-2">Посмотреть</a>
                        </div>
                    </div>
                </div>
                ` : ''}
                ${overdue.length === 0 && returningSoon.length === 0 ? `<div class="col-12"><div class="alert alert-success">✅ Все аренды в порядке, просрочек нет</div></div>` : ''}
            </div>

            <div class="row g-3">
                <div class="col-md-2 col-6"><div class="card text-bg-primary card-dashboard"><div class="card-body"><h5>Всего</h5><h2>${total}</h2></div></div></div>
                <div class="col-md-2 col-6"><div class="card text-bg-success card-dashboard"><div class="card-body"><h5>Свободно</h5><h2>${available}</h2></div></div></div>
                <div class="col-md-2 col-6"><div class="card text-bg-warning card-dashboard"><div class="card-body"><h5>В аренде</h5><h2>${rented}</h2></div></div></div>
                <div class="col-md-2 col-6"><div class="card text-bg-info card-dashboard"><div class="card-body"><h5>Забронировано</h5><h2>${reserved}</h2></div></div></div>
                <div class="col-md-2 col-6"><div class="card text-bg-danger card-dashboard"><div class="card-body"><h5>На ТО</h5><h2>${maintenance}</h2></div></div></div>
                <div class="col-md-2 col-6"><div class="card text-bg-secondary card-dashboard"><div class="card-body"><h5>Броней</h5><h2>${bookings}</h2></div></div></div>
            </div>

            <div class="row mt-4 g-3">
                <div class="col-md-4"><div class="card card-dashboard"><div class="card-body"><h5>Выручка сегодня</h5><h3>${revenueToday} ₽</h3></div></div></div>
                <div class="col-md-4"><div class="card card-dashboard"><div class="card-body"><h5>Невозвращённые залоги</h5><h3>${totalDeposits} ₽</h3></div></div></div>
                <div class="col-md-4"><div class="card card-dashboard"><div class="card-body"><h5>Активных аренд</h5><h3>${activeRentals}</h3></div></div></div>
            </div>

            <div class="chart-container mt-4">
                <h5>Выручка за последние 7 дней</h5>
                <div class="chart-bar">
                    ${chartData.map(d => `
                    <div style="flex:1; display:flex; flex-direction:column; align-items:center;">
                        <div class="chart-bar-item" style="height: ${(d.revenue / maxRevenue) * 100}%; min-height: 4px; width: 100%; background: ${d.revenue > 0 ? '#0d6efd' : '#e9ecef'};">
                            <span class="tooltip-text">${d.revenue} ₽</span>
                        </div>
                        <div class="chart-label">${formatDateShort(d.date)}</div>
                    </div>
                    `).join('')}
                </div>
            </div>

            <h4 class="mt-4">Последние аренды</h4>
            <div class="table-responsive"><table class="table table-striped table-hover">
                <thead><tr><th>№</th><th>Клиент</th><th>Инструмент</th><th>Выдача</th><th>Возврат (план)</th><th>Статус</th></tr></thead>
                <tbody>
                ${recent.length === 0 ? '<tr><td colspan="6" class="text-center text-muted">Нет записей</td></tr>' : 
                    recent.map(r => {
                        const c = getClientById(r.client_id), t = getToolById(r.tool_id);
                        return `<tr><td>${r.rental_number || '—'}</td><td>${c ? c.name : 'Удалён'}</td><td>${t ? t.model : 'Удалён'}</td><td>${formatDate(r.issue_date)}</td><td>${formatDate(r.planned_return)}</td><td><span class="badge bg-${getStatusColor(r.status)} rental-badge">${r.status || '—'}</span></td></tr>`;
                    }).join('')
                }
                </tbody></table></div>`;
            render(html);
        }

        // ---------- ИНСТРУМЕНТЫ (с поиском и фильтром) ----------
        function renderTools() {
            // Читаем значения из DOM, если они существуют, иначе пустые
            const searchInput = document.getElementById('toolSearch');
            const statusSelect = document.getElementById('toolStatusFilter');
            const search = searchInput ? searchInput.value : '';
            const status = statusSelect ? statusSelect.value : '';

            let filtered = tools;
            if (search) filtered = filtered.filter(t => t.model?.toLowerCase().includes(search.toLowerCase()) || t.inventory_number?.toLowerCase().includes(search.toLowerCase()));
            if (status) filtered = filtered.filter(t => t.status === status);

            let html = `
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h1>Инструменты</h1>
                <button class="btn btn-primary" onclick="window._addTool()">➕ Добавить</button>
            </div>
            <div class="filter-section">
                <div class="row g-2">
                    <div class="col-md-4">
                        <input type="text" id="toolSearch" class="form-control" placeholder="Поиск по модели или инв. №" value="${search}" oninput="renderTools()">
                    </div>
                    <div class="col-md-3">
                        <select id="toolStatusFilter" class="form-select" onchange="renderTools()">
                            <option value="">Все статусы</option>
                            <option value="в наличии" ${status === 'в наличии' ? 'selected' : ''}>В наличии</option>
                            <option value="в аренде" ${status === 'в аренде' ? 'selected' : ''}>В аренде</option>
                            <option value="забронирован" ${status === 'забронирован' ? 'selected' : ''}>Забронирован</option>
                            <option value="на обслуживании" ${status === 'на обслуживании' ? 'selected' : ''}>На ТО</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="table-responsive"><table class="table table-hover table-tools">
                <thead><tr><th>Инв. №</th><th>Категория</th><th>Модель</th><th>Цена/сутки</th><th>Залог</th><th>Статус</th><th>Действия</th></tr></thead>
                <tbody>
                ${filtered.length === 0 ? '<tr><td colspan="7" class="text-center text-muted">Нет инструментов</td></tr>' : 
                    filtered.map(t => `
                        <tr>
                            <td><strong>${t.inventory_number || '—'}</strong></td>
                            <td>${t.category || '—'}</td>
                            <td>${t.model || '—'}</td>
                            <td>${t.price_per_day || 0} ₽</td>
                            <td>${t.deposit || 0} ₽</td>
                            <td><span class="badge bg-${getStatusColor(t.status)} rental-badge">${t.status || '—'}</span></td>
                            <td>
                                <button class="btn btn-sm btn-outline-primary btn-edit" onclick="window._editTool('${t.id}')">✎</button>
                                <button class="btn btn-sm btn-outline-danger" onclick="window._deleteTool('${t.id}')">✕</button>
                            </td>
                        </tr>
                    `).join('')
                }
                </tbody></table></div>`;
            render(html);
        }

        window._addTool = function() {
            render(`
            <h1>Добавить инструмент</h1>
            <form onsubmit="window._saveTool(event)">
                <div class="mb-3"><label>Инв. номер</label><input id="fInv" class="form-control" required /></div>
                <div class="mb-3"><label>Категория</label><input id="fCat" class="form-control" required /></div>
                <div class="mb-3"><label>Модель</label><input id="fModel" class="form-control" required /></div>
                <div class="mb-3"><label>Цена за сутки (₽)</label><input id="fPrice" type="number" step="0.01" class="form-control" required /></div>
                <div class="mb-3"><label>Залог (₽)</label><input id="fDeposit" type="number" step="0.01" class="form-control" required /></div>
                <input type="hidden" id="fEditId" value="" />
                <button type="submit" class="btn btn-success">Сохранить</button>
                <button type="button" class="btn btn-secondary" onclick="navigate('tools')">Отмена</button>
            </form>
            `);
        };

        window._editTool = function(id) {
            const tool = getToolById(id);
            if (!tool) return;
            render(`
            <h1>Редактировать инструмент</h1>
            <form onsubmit="window._saveTool(event)">
                <div class="mb-3"><label>Инв. номер</label><input id="fInv" class="form-control" value="${tool.inventory_number || ''}" required /></div>
                <div class="mb-3"><label>Категория</label><input id="fCat" class="form-control" value="${tool.category || ''}" required /></div>
                <div class="mb-3"><label>Модель</label><input id="fModel" class="form-control" value="${tool.model || ''}" required /></div>
                <div class="mb-3"><label>Цена за сутки (₽)</label><input id="fPrice" type="number" step="0.01" class="form-control" value="${tool.price_per_day || 0}" required /></div>
                <div class="mb-3"><label>Залог (₽)</label><input id="fDeposit" type="number" step="0.01" class="form-control" value="${tool.deposit || 0}" required /></div>
                <input type="hidden" id="fEditId" value="${id}" />
                <button type="submit" class="btn btn-success">Обновить</button>
                <button type="button" class="btn btn-secondary" onclick="navigate('tools')">Отмена</button>
            </form>
            `);
        };

        window._saveTool = async function(e) {
            e.preventDefault();
            const id = document.getElementById('fEditId').value;
            const data = {
                inventory_number: document.getElementById('fInv').value.trim(),
                category: document.getElementById('fCat').value.trim(),
                model: document.getElementById('fModel').value.trim(),
                price_per_day: parseFloat(document.getElementById('fPrice').value) || 0,
                deposit: parseFloat(document.getElementById('fDeposit').value) || 0,
            };
            if (id) {
                const { error } = await supabase.from('tools').update(data).eq('id', id);
                if (error) { alert('Ошибка обновления: ' + error.message); return; }
            } else {
                const newTool = { id: genId(), ...data, status: 'в наличии', repair_reason: '', repair_date: null };
                const { error } = await supabase.from('tools').insert(newTool);
                if (error) { alert('Ошибка добавления: ' + error.message); return; }
            }
            await refreshAllData();
            navigate('tools');
        };

        window._deleteTool = async function(id) {
            if (!confirm('Удалить инструмент?')) return;
            const { error } = await supabase.from('tools').delete().eq('id', id);
            if (error) { alert('Ошибка удаления: ' + error.message); return; }
            await refreshAllData();
            navigate('tools');
        };

        // ---------- КЛИЕНТЫ (с поиском) ----------
        function renderClients() {
            const searchInput = document.getElementById('clientSearch');
            const search = searchInput ? searchInput.value : '';

            let filtered = clients;
            if (search) filtered = filtered.filter(c => c.name?.toLowerCase().includes(search.toLowerCase()) || c.phone?.includes(search));

            let html = `
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h1>Клиенты</h1>
                <button class="btn btn-primary" onclick="window._addClient()">➕ Добавить</button>
            </div>
            <div class="filter-section">
                <div class="row g-2">
                    <div class="col-md-4">
                        <input type="text" id="clientSearch" class="form-control" placeholder="Поиск по имени или телефону" value="${search}" oninput="renderClients()">
                    </div>
                </div>
            </div>
            <div class="table-responsive"><table class="table table-hover">
                <thead><tr><th>Имя</th><th>Телефон</th><th>Email</th><th>Аренд</th><th>Действия</th></tr></thead>
                <tbody>
                ${filtered.length === 0 ? '<tr><td colspan="5" class="text-center text-muted">Нет клиентов</td></tr>' : 
                    filtered.map(c => {
                        const count = rentals.filter(r => r.client_id === c.id).length;

        window._saveRental = async function(e) {
            e.preventDefault();
            const clientId = document.getElementById('rClient').value;
            const toolId = document.getElementById('rTool').value;
            const days = parseInt(document.getElementById('rDays').value) || 1;
            const issueDate = document.getElementById('rDate').value;
            const comment = document.getElementById('rComment').value.trim();
            const reserve = document.getElementById('rReserve').checked;

            if (!clientId) { alert('Выберите клиента'); return; }
            if (!toolId) { alert('Выберите инструмент'); return; }

            const tool = getToolById(toolId);
            if (!tool || (tool.status !== 'в наличии' && tool.status !== 'забронирован')) {
                alert('Инструмент недоступен');
                return;
            }

            // Если инструмент забронирован другим, проверяем, что бронь не истекла
            if (tool.status === 'забронирован' && tool.reserved_until) {
                if (new Date(tool.reserved_until) < new Date(issueDate)) {
                    alert('Бронь на этот инструмент истекла. Обновите страницу.');
                    return;
                }
            }

            const planned = new Date(issueDate);
            planned.setDate(planned.getDate() + days);

            // Определяем статус аренды
            const rentalStatus = reserve ? 'забронирована' : 'активна';
            const toolStatus = reserve ? 'забронирован' : 'в аренде';
            const reservedUntil = reserve ? issueDate : null;

            // Создаём аренду
            const rental = {
                id: genId(),
                rental_number: 'AR-' + Date.now().toString(36).toUpperCase(),
                client_id: clientId,
                tool_id: toolId,
                issue_date: issueDate,
                planned_return: planned.toISOString().split('T')[0],
                actual_return: null,
                price_per_day: tool.price_per_day,
                total_cost: tool.price_per_day * days,
                deposit: tool.deposit,
                status: rentalStatus,
                return_condition: '',
                comment: comment,
                deposit_returned: false
            };

            // Обновляем инструмент
            const toolUpdate = {
                status: toolStatus,
                reserved_until: reservedUntil
            };

            const { error: toolError } = await supabase.from('tools').update(toolUpdate).eq('id', toolId);
            if (toolError) { alert('Ошибка обновления инструмента: ' + toolError.message); return; }

            const { error: rentalError } = await supabase.from('rentals').insert(rental);
            if (rentalError) { alert('Ошибка создания аренды: ' + rentalError.message); return; }

            await refreshAllData();
            navigate('dashboard');
        };

            if (!confirm('Перевести бронь в активную аренду?')) return;
            const rental = rentals.find(r => r.id === rentalId);
            if (!rental) return;
            if (rental.status !== 'забронирована') { alert('Это не бронь'); return; }

            // Обновляем аренду
            const { error: rentalError } = await supabase.from('rentals').update({
                status: 'активна'
            }).eq('id', rentalId);
            if (rentalError) { alert('Ошибка: ' + rentalError.message); return; }

            // Обновляем инструмент
            const tool = getToolById(rental.tool_id);
            if (tool) {
                const { error: toolError } = await supabase.from('tools').update({
                    status: 'в аренде',
                    reserved_until: null
                }).eq('id', tool.id);
                if (toolError) { alert('Ошибка: ' + toolError.message); return; }
            }

            await refreshAllData();
            navigate('bookings');
        };

        window._returnRental = async function(sendToRepair) {
            const rentalId = document.getElementById('retRental').value;
            const actualReturn = document.getElementById('retDate').value;
            const condition = document.getElementById('retCondition') ? document.getElementById('retCondition').value : 'Хорошее';
            const depositReturned = document.getElementById('retDepositReturned').checked;
            if (!rentalId) { alert('Выберите аренду'); return; }

            const rental = rentals.find(r => r.id === rentalId);
            if (!rental) return;

            const planned = new Date(rental.planned_return);
            const actual = new Date(actualReturn);
            let totalCost = rental.total_cost;
            if (actual > planned) {
                const extraDays = Math.ceil((actual - planned) / (1000 * 60 * 60 * 24));
                totalCost += extraDays * rental.price_per_day;
            }

            const { error: rentalError } = await supabase.from('rentals').update({
                actual_return: actualReturn,
                status: 'закрыта',
                return_condition: condition,
                total_cost: totalCost,
                deposit_returned: depositReturned
            }).eq('id', rentalId);
            if (rentalError) { alert('Ошибка обновления аренды: ' + rentalError.message); return; }

            const toolId = rental.tool_id;
            const toolUpdate = sendToRepair
                ? { status: 'на обслуживании', repair_reason: condition, repair_date: actualReturn }
                : { status: 'в наличии', repair_reason: '', repair_date: null };
            const { error: toolError } = await supabase.from('tools').update(toolUpdate).eq('id', toolId);
            if (toolError) { alert('Ошибка обновления инструмента: ' + toolError.message); return; }

            await refreshAllData();
            navigate('dashboard');
        };

                        <td>${t.model || '—'}</td>
                        <td>${t.repair_reason || '—'}</td>
                        <td>${formatDate(t.repair_date)}</td>
                        <td><button class="btn btn-sm btn-success" onclick="window._returnFromRepair('${t.id}')">Вернуть с ТО</button></td>
                    </tr>
                `).join('')}
                </tbody></table></div>`}
            `;
            render(html);
        }

        window._returnFromRepair = async function(toolId) {
            if (!confirm('Вернуть инструмент с ТО в наличие?')) return;
            const { error } = await supabase.from('tools').update({
                status: 'в наличии',
                repair_reason: '',
                repair_date: null
            }).eq('id', toolId);
            if (error) { alert('Ошибка: ' + error.message); return; }
            await refreshAllData();
            navigate('repair');
        };

        // ---------- ИСТОРИЯ (с поиском и фильтром) ----------
        function renderHistory() {
            const searchInput = document.getElementById('historySearch');
            const filterSelect = document.getElementById('historyFilter');
            const search = searchInput ? searchInput.value : '';
            const filter = filterSelect ? filterSelect.value : 'all';

            let filtered = rentals;
            if (filter === 'active') filtered = rentals.filter(r => r.status === 'активна');
            else if (filter === 'closed') filtered = rentals.filter(r => r.status === 'закрыта');
            else if (filter === 'booked') filtered = rentals.filter(r => r.status === 'забронирована');

            if (search) filtered = filtered.filter(r => {
                const c = getClientById(r.client_id);
                const t = getToolById(r.tool_id);
                return (c?.name?.toLowerCase().includes(search.toLowerCase()) || t?.model?.toLowerCase().includes(search.toLowerCase()) || r.rental_number?.toLowerCase().includes(search.toLowerCase()));
            });
            const sorted = [...filtered].sort((a, b) => (b.id || '').localeCompare(a.id || ''));

            let html = `
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h1>📜 История аренд</h1>
                <button class="btn btn-outline-success btn-sm" onclick="window._exportCSV()">📥 CSV</button>
            </div>
            <div class="filter-section">
                <div class="row g-2">
                    <div class="col-md-4">
                        <input type="text" id="historySearch" class="form-control" placeholder="Поиск" value="${search}" oninput="renderHistory()">
                    </div>
                    <div class="col-md-3">
                        <select id="historyFilter" class="form-select" onchange="renderHistory()">
                            <option value="all" ${filter === 'all' ? 'selected' : ''}>Все</option>
                            <option value="active" ${filter === 'active' ? 'selected' : ''}>Активные</option>
                            <option value="closed" ${filter === 'closed' ? 'selected' : ''}>Закрытые</option>
                            <option value="booked" ${filter === 'booked' ? 'selected' : ''}>Брони</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="table-responsive"><table class="table table-striped table-hover">
                <thead><tr>
                    <th>№</th><th>Клиент</th><th>Инструмент</th><th>Выдача</th><th>План возврат</th><th>Факт возврат</th><th>Сумма</th><th>Залог</th><th>Залог возвращён</th><th>Состояние</th><th>Комментарий</th><th>Статус</th><th>Действие</th>
                </tr></thead>
                <tbody>
                ${sorted.length === 0 ? '<tr><td colspan="13" class="text-center text-muted">Нет записей</td></tr>' :
                    sorted.map(r => {
                        const c = getClientById(r.client_id);
                        const t = getToolById(r.tool_id);
                        const canDelete = r.status !== 'активна' && r.status !== 'забронирована';
                        return `<tr>
                            <td>${r.rental_number || '—'}</td>
                            <td>${c ? c.name : 'Удалён'}</td>
                            <td>${t ? t.model : 'Удалён'}</td>
                            <td>${formatDate(r.issue_date)}</td>
                            <td>${formatDate(r.planned_return)}</td>
                            <td>${formatDate(r.actual_return)}</td>
                            <td>${r.total_cost || 0} ₽</td>
                            <td>${r.deposit || 0} ₽</td>
                            <td>${r.deposit_returned ? '✅ Да' : '❌ Нет'}</td>
                            <td>${r.return_condition || '—'}</td>
                            <td>${r.comment || '—'}</td>
                            <td><span class="badge bg-${getStatusColor(r.status)} rental-badge">${r.status || '—'}</span></td>
                            <td>${canDelete ? `<button class="btn btn-sm btn-outline-danger" onclick="window._deleteRental('${r.id}')">🗑</button>` : '<span class="text-muted">—</span>'}</td>
                        </tr>`;
                    }).join('')
                }
                </tbody></table></div>`;
            render(html);
        }

        window._exportCSV = function() {
            if (rentals.length === 0) { alert('Нет данных'); return; }
            let csv = '№,Клиент,Инструмент,Выдача,План возврат,Факт возврат,Цена/сутки,Сумма,Залог,Залог возвращён,Состояние,Комментарий,Статус\n';
            rentals.forEach(r => {
                const c = getClientById(r.client_id);
                const t = getToolById(r.tool_id);
                csv += `"${r.rental_number || ''}","${c ? c.name : ''}","${t ? t.model : ''}",`;
                csv += `"${formatDate(r.issue_date)}","${formatDate(r.planned_return)}","${formatDate(r.actual_return)}",`;
                csv += `"${r.price_per_day || 0}","${r.total_cost || 0}","${r.deposit || 0}","${r.deposit_returned ? 'Да' : 'Нет'}",`;
                csv += `"${r.return_condition || ''}","${r.comment || ''}","${r.status || ''}"\n`;
            });
            const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `аренды_${todayStr()}.csv`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(link.href);
        };

        window._deleteRental = async function(rentalId) {
            if (!confirm('Удалить эту аренду?')) return;
            const rental = rentals.find(r => r.id === rentalId);
            if (!rental) return;
            if (rental.status === 'активна' || rental.status === 'забронирована') {
                alert('Нельзя удалить активную аренду или бронь');
                return;
            }
            const { error } = await supabase.from('rentals').delete().eq('id', rentalId);
            if (error) { alert('Ошибка удаления: ' + error.message); return; }
            await refreshAllData();
            renderHistory();
        };

        // ---------- АВТОРИЗАЦИЯ ----------
        window.login = async function(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const { data, error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) { alert('Ошибка входа: ' + error.message); return; }
            if (data.user) {
                document.getElementById('loginPage').classList.add('hidden');
                document.getElementById('registerPage').classList.add('hidden');
                document.getElementById('mainApp').classList.remove('hidden');
                document.getElementById('mainNav').style.display = 'flex';
                await refreshAllData();
                navigate('dashboard');
            }
        };

        window.register = async function(e) {
            e.preventDefault();
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            const { data, error } = await supabase.auth.signUp({ email, password });
            if (error) { alert('Ошибка регистрации: ' + error.message); return; }
            alert('Регистрация успешна! Теперь войдите.');
            showLogin();
        };

        window.logout = async function() {
            await supabase.auth.signOut();
            document.getElementById('loginPage').classList.remove('hidden');
            document.getElementById('registerPage').classList.add('hidden');
            document.getElementById('mainApp').classList.add('hidden');
            document.getElementById('mainNav').style.display = 'none';
            tools = []; clients = []; rentals = [];
        };

        window.showRegister = function() {
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('registerPage').classList.remove('hidden');
        };

        window.showLogin = function() {
            document.getElementById('registerPage').classList.add('hidden');
            document.getElementById('loginPage').classList.remove('hidden');
        };

        // ---------- СЕССИЯ ----------
        async function checkSession() {
            const { data: { user } } = await supabase.auth.getUser();
            if (user) {
                document.getElementById('loginPage').classList.add('hidden');
                document.getElementById('registerPage').classList.add('hidden');
                document.getElementById('mainApp').classList.remove('hidden');
                document.getElementById('mainNav').style.display = 'flex';
                await refreshAllData();
                navigate('dashboard');
            } else {
                document.getElementById('loginPage').classList.remove('hidden');
                document.getElementById('registerPage').classList.add('hidden');
                document.getElementById('mainApp').classList.add('hidden');
                document.getElementById('mainNav').style.display = 'none';
            }
        }

        checkSession();
    })();
</script>
</body>
</html>
