<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>СК Квадрант — Учёт аренды</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { padding-top: 70px; background: #f4f6fa; transition: background 0.3s, color 0.3s; }
        .navbar-brand { font-weight: 800; letter-spacing: -0.5px; color: #fff !important; }
        .brand-highlight { color: #ffc107; }
        .card-dashboard {
            transition: 0.3s;
            border: none;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            background: #fff;
        }
        .card-dashboard:hover { transform: translateY(-6px); box-shadow: 0 8px 24px rgba(0,0,0,0.10); }
        .card-dashboard .card-body { padding: 1.5rem; }
        .card-dashboard h5 { font-size: 0.85rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; opacity: 0.8; }
        .card-dashboard h2, .card-dashboard h3 { font-weight: 700; }

        .filter-section {
            background: #fff;
            padding: 12px 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            margin-bottom: 20px;
            transition: background 0.3s;
        }
        .table th { font-weight: 600; color: #2c3e50; border-top: none; }
        .table td { vertical-align: middle; }
        .rental-badge { font-size: 0.7rem; padding: 0.35rem 0.65rem; border-radius: 20px; }
        .btn-edit { margin-right: 4px; }
        .login-container {
            max-width: 420px;
            margin: 60px auto;
            background: #fff;
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 12px 48px rgba(0,0,0,0.08);
        }
        .login-container h2 { font-weight: 700; color: #1a1a2e; }
        .login-container .brand-icon { font-size: 2.5rem; color: #0d6efd; }
        .hidden { display: none; }

        .chart-container {
            background: #fff;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            transition: background 0.3s;
        }
        .chart-bar {
            display: flex;
            align-items: flex-end;
            height: 140px;
            gap: 8px;
            padding-top: 12px;
        }
        .chart-bar-item {
            flex: 1;
            min-height: 6px;
            border-radius: 6px 6px 0 0;
            transition: 0.3s;
            position: relative;
            cursor: pointer;
            background: #e9ecef;
        }
        .chart-bar-item:hover { opacity: 0.8; transform: scaleY(1.03); }
        .chart-bar-item .tooltip-text {
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: #1a1a2e;
            color: #fff;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            white-space: nowrap;
            display: none;
            font-weight: 500;
        }
        .chart-bar-item:hover .tooltip-text { display: block; }
        .chart-label {
            font-size: 10px;
            text-align: center;
            margin-top: 6px;
            color: #6c757d;
            font-weight: 500;
        }

        .toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 9999; }
        .toast-custom {
            background: #1a1a2e;
            color: #fff;
            border-radius: 12px;
            padding: 14px 24px;
            margin-bottom: 10px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 12px;
            animation: slideUp 0.3s ease;
        }
        .toast-custom.success { background: #198754; }
        .toast-custom.danger { background: #dc3545; }
        .toast-custom.warning { background: #ffc107; color: #1a1a2e; }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .spinner-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9998;
        }
        .spinner-overlay .spinner-border { width: 3rem; height: 3rem; }

        @media (max-width: 576px) {
            .card-dashboard .card-body { padding: 1rem; }
            .login-container { margin: 30px 15px; padding: 30px 20px; }
            .table-responsive { font-size: 0.85rem; }
        }

        [data-tooltip] { position: relative; }
        [data-tooltip]:hover::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: calc(100% + 6px);
            left: 50%;
            transform: translateX(-50%);
            background: #1a1a2e;
            color: #fff;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            white-space: nowrap;
            font-weight: 500;
            z-index: 1000;
        }
        .fade-enter { opacity: 0; transform: translateY(10px); }
        .fade-enter-active { opacity: 1; transform: translateY(0); transition: opacity 0.3s ease, transform 0.3s ease; }

        /* Тёмная тема */
        body.dark-mode {
            background: #1a1a2e;
            color: #e0e0e0;
        }
        body.dark-mode .card,
        body.dark-mode .filter-section,
        body.dark-mode .chart-container,
        body.dark-mode .login-container {
            background: #2d2d44;
            color: #e0e0e0;
        }
        body.dark-mode .table {
            color: #e0e0e0;
        }
        body.dark-mode .table th {
            color: #ddd;
        }
        body.dark-mode .table-striped>tbody>tr:nth-of-type(odd)>* {
            background-color: rgba(255,255,255,0.03);
        }
        body.dark-mode .btn-outline-secondary {
            color: #ddd;
            border-color: #555;
        }
        body.dark-mode .btn-outline-secondary:hover {
            color: #fff;
            background-color: #555;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top" id="mainNav">
    <div class="container">
        <span class="navbar-brand" style="cursor:default;">
            <i class="bi bi-tools me-2"></i>СК <span class="brand-highlight">Квадрант</span>
        </span>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav me-auto" id="navList">
                <li class="nav-item"><a class="nav-link active" href="#" data-page="dashboard"><i class="bi bi-speedometer2 me-1"></i>Дашборд</a></li>
                <li class="nav-item"><a class="nav-link" href="#" data-page="tools"><i class="bi bi-hammer me-1"></i>Инструменты</a></li>
                <li class="nav-item"><a class="nav-link" href="#" data-page="clients"><i class="bi bi-people me-1"></i>Клиенты</a></li>
                <li class="nav-item"><a class="nav-link" href="#" data-page="newRental"><i class="bi bi-plus-circle me-1"></i>Выдать</a></li>
                <li class="nav-item"><a class="nav-link" href="#" data-page="activeRentals"><i class="bi bi-play-circle me-1"></i>Активные</a></li>
                <li class="nav-item"><a class="nav-link" href="#" data-page="bookings"><i class="bi bi-calendar-check me-1"></i>Брони</a></li>
                <li class="nav-item"><a class="nav-link" href="#" data-page="returnRental"><i class="bi bi-arrow-return-left me-1"></i>Вернуть</a></li>
                <li class="nav-item"><a class="nav-link" href="#" data-page="repair"><i class="bi bi-wrench me-1"></i>ТО</a></li>
                <li class="nav-item"><a class="nav-link" href="#" data-page="history"><i class="bi bi-clock-history me-1"></i>История</a></li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link" href="#" onclick="logout()"><i class="bi bi-box-arrow-right me-1"></i>Выйти</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container" id="app">
    <div id="loginPage" class="login-container">
        <div class="text-center mb-4">
            <i class="bi bi-tools brand-icon"></i>
            <h2 class="mt-2">СК Квадрант</h2>
            <p class="text-muted">Учёт аренды строительного инструмента</p>
        </div>
        <form onsubmit="login(event)">
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" id="loginEmail" class="form-control" placeholder="example@mail.ru" required />
            </div>
            <div class="mb-3">
                <label class="form-label">Пароль</label>
                <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required />
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2">Войти</button>
            <hr />
            <p class="text-center text-muted small">Нет аккаунта? <a href="#" onclick="showRegister()">Зарегистрируйтесь</a></p>
        </form>
    </div>

    <div id="registerPage" class="login-container hidden">
        <div class="text-center mb-4">
            <i class="bi bi-person-plus brand-icon"></i>
            <h2 class="mt-2">Регистрация</h2>
        </div>
        <form onsubmit="register(event)">
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" id="regEmail" class="form-control" required />
            </div>
            <div class="mb-3">
                <label class="form-label">Пароль (≥6 символов)</label>
                <input type="password" id="regPassword" class="form-control" required minlength="6" />
            </div>
            <button type="submit" class="btn btn-success w-100 py-2">Зарегистрироваться</button>
            <hr />
            <p class="text-center text-muted small">Уже есть аккаунт? <a href="#" onclick="showLogin()">Войдите</a></p>

    </div>

    <div id="mainApp" class="hidden">
        <div id="appContent"></div>
    </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    (function() {
        'use strict';

        const SUPABASE_URL = 'https://jptbqcbpllffgufusibj.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_gHL-E4wUy2KbNnwcnxj-Cw_pY5eaxth';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Вспомогательные функции
        function genId() { return Date.now().toString(36) + Math.random().toString(36).substring(2, 8); }
        function todayStr() { return new Date().toISOString().split('T')[0]; }
        function formatDate(dateStr) { if (!dateStr) return '—'; return new Date(dateStr).toLocaleDateString('ru-RU'); }
        function formatDateShort(dateStr) { if (!dateStr) return '—'; return new Date(dateStr).toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' }); }
        function daysBetween(date1, date2) { return Math.ceil((new Date(date2) - new Date(date1)) / (1000*60*60*24)); }
        function getStatusColor(status) {
            const map = {
                'в наличии': 'success', 'в аренде': 'warning', 'на обслуживании': 'danger',
                'забронирован': 'info', 'активна': 'warning', 'закрыта': 'secondary',
                'просрочена': 'danger', 'забронирована': 'info'
            };
            return map[status] || 'secondary';
        }

        let tools = [], clients = [], rentals = [];

        async function loadTools() { const { data, error } = await supabase.from('tools').select('*'); if (error) { console.error(error); return []; } return data || []; }
        async function loadClients() { const { data, error } = await supabase.from('clients').select('*'); if (error) { console.error(error); return []; } return data || []; }
        async function loadRentals() { const { data, error } = await supabase.from('rentals').select('*'); if (error) { console.error(error); return []; } return data || []; }
        async function refreshAllData() {
            showSpinner();
            [tools, clients, rentals] = await Promise.all([loadTools(), loadClients(), loadRentals()]);
            hideSpinner();
        }
        function getToolById(id) { return tools.find(t => t.id === id); }
        function getClientById(id) { return clients.find(c => c.id === id); }

        function showSpinner() {
            if (!document.getElementById('spinnerOverlay')) {
                const overlay = document.createElement('div');
                overlay.id = 'spinnerOverlay';
                overlay.className = 'spinner-overlay';
                overlay.innerHTML = '<div class="spinner-border text-primary" role="status"><span class="visually-hidden">Загрузка...</span></div>';
                document.body.appendChild(overlay);
            }
        }
        function hideSpinner() {
            const el = document.getElementById('spinnerOverlay');
            if (el) el.remove();
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast-custom ${type}`;
            toast.innerHTML = `<span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => { toast.remove(); }, 4000);
        }

        // ============================================================
        // ГЛОБАЛЬНОЕ СОСТОЯНИЕ
        // ============================================================
        const state = {
            currentPage: 'dashboard',
            history: ['dashboard'],
            filters: {
                tools: { search: '', status: '' },
                clients: { search: '' },
                activeRentals: { search: '', status: '' },
                bookings: { search: '' },
                history: { search: '', filter: 'all', dateFrom: '', dateTo: '' }
            },
            pagination: {
                tools: { page: 1, perPage: 10 },
                clients: { page: 1, perPage: 10 },
                activeRentals: { page: 1, perPage: 10 },
                bookings: { page: 1, perPage: 10 },
                history: { page: 1, perPage: 10 }
            },
            sort: {
                tools: { field: 'model', order: 'asc' },
                clients: { field: 'name', order: 'asc' },
                activeRentals: { field: 'issue_date', order: 'desc' },
                bookings: { field: 'issue_date', order: 'desc' },
                history: { field: 'created_at', order: 'desc' }
            },
            darkMode: false
        };

        // ============================================================
        // НАВИГАЦИЯ
        // ============================================================
        function navigate(page, pushHistory = true) {
            if (pushHistory && state.history[state.history.length - 1] !== page) {
                state.history.push(page);
            }
            state.currentPage = page;
            document.querySelectorAll('#navList .nav-link').forEach(el => el.classList.remove('active'));
            const link = document.querySelector(`#navList .nav-link[data-page="${page}"]`);
            if (link) link.classList.add('active');
            renderCurrentPage();
        }

        function goBack() {
            if (state.history.length > 1) {
                state.history.pop();
                const prev = state.history[state.history.length - 1];
                state.currentPage = prev;
                renderCurrentPage();
                document.querySelectorAll('#navList .nav-link').forEach(el => el.classList.remove('active'));
                const link = document.querySelector(`#navList .nav-link[data-page="${prev}"]`);
                if (link) link.classList.add('active');
            } else {
                navigate('dashboard');
            }
        }

        // ============================================================
        // ОСНОВНОЙ РЕНДЕР
        // ============================================================
        function renderCurrentPage() {
            const container = document.getElementById('appContent');
            container.classList.remove('fade-enter-active');
            container.classList.add('fade-enter');
            switch (state.currentPage) {
                case 'dashboard':       renderDashboard(container); break;
                case 'tools':           renderTools(container); break;
                case 'clients':         renderClients(container); break;
                case 'newRental':       renderNewRental(container); break;
                case 'activeRentals':   renderActiveRentals(container); break;
                case 'bookings':        renderBookings(container); break;
                case 'returnRental':    renderReturnRental(container); break;
                case 'repair':          renderRepair(container); break;
                case 'history':         renderHistory(container); break;
                default: renderDashboard(container);
            }
            requestAnimationFrame(() => {
                container.classList.remove('fade-enter');
                container.classList.add('fade-enter-active');
            });
        }

        function render(container, html) {
            container.innerHTML = html;
        }

        // ============================================================
        // ВСПОМОГАТЕЛЬНЫЕ ДЛЯ ПАГИНАЦИИ И СОРТИРОВКИ
        // ============================================================
        function applyPaginationAndSort(items, pageKey) {
            const sort = state.sort[pageKey];
            const pag = state.pagination[pageKey];
            if (!sort || !pag) return { items, total: items.length, page: 1, perPage: 10, totalPages: 1 };
            const sorted = [...items].sort((a, b) => {
                let valA = a[sort.field] || '';
                let valB = b[sort.field] || '';
                if (typeof valA === 'string') valA = valA.toLowerCase();
                if (typeof valB === 'string') valB = valB.toLowerCase();
                if (valA < valB) return sort.order === 'asc' ? -1 : 1;
                if (valA > valB) return sort.order === 'asc' ? 1 : -1;
                return 0;
            });
            const start = (pag.page - 1) * pag.perPage;
            const end = start + pag.perPage;
            const paginated = sorted.slice(start, end);
            return {
                items: paginated,
                total: items.length,
                page: pag.page,
                perPage: pag.perPage,
                totalPages: Math.ceil(items.length / pag.perPage)
            };
        }

        // ============================================================
        // ДЕЛЕГИРОВАНИЕ СОБЫТИЙ
        // ============================================================
        document.getElementById('appContent').addEventListener('click', function(e) {
            const target = e.target.closest('[data-action]');
            if (!target) return;
            const action = target.dataset.action;
            const param = target.dataset.param || '';
            if (typeof window[action] === 'function') {
                window[action](param);
            } else {
                console.warn('Action not found:', action);
            }
        });

        document.getElementById('appContent').addEventListener('input', function(e) {
            const target = e.target;
            if (target.dataset.filter) {
                const [page, field] = target.dataset.filter.split('.');
                if (state.filters[page]) {
                    state.filters[page][field] = target.value;
                    if (state.pagination[page]) state.pagination[page].page = 1;
                    renderCurrentPage();
                }
            }
            if (target.dataset.dateRange) {
                const [page, field] = target.dataset.dateRange.split('.');
                if (state.filters[page]) {
                    state.filters[page][field] = target.value;
                    if (state.pagination[page]) state.pagination[page].page = 1;
                    renderCurrentPage();
                }
            }
        });

        document.getElementById('appContent').addEventListener('change', function(e) {
            const target = e.target;
            if (target.dataset.filter) {
                const [page, field] = target.dataset.filter.split('.');
                if (state.filters[page]) {
                    state.filters[page][field] = target.value;
                    if (state.pagination[page]) state.pagination[page].page = 1;
                    renderCurrentPage();
                }
            }
            if (target.dataset.sort) {
                const [page, field] = target.dataset.sort.split('.');
                const current = state.sort[page];
                if (current.field === field) {
                    current.order = current.order === 'asc' ? 'desc' : 'asc';
                } else {
                    current.field = field;
                    current.order = 'asc';
                }
                renderCurrentPage();
            }
            if (target.dataset.perPage) {
                const [page, value] = target.dataset.perPage.split('.');
                if (state.pagination[page]) {
                    state.pagination[page].perPage = parseInt(value) || 10;
                    state.pagination[page].page = 1;
                    renderCurrentPage();
                }
            }
        });

        // ============================================================
        // СТРАНИЦЫ РЕНДЕРИНГА
        // ============================================================

        // ---------- ДАШБОРД ----------
        function renderDashboard(container) {
            const total = tools.length;
            const available = tools.filter(t => t.status === 'в наличии').length;
            const rented = tools.filter(t => t.status === 'в аренде').length;
            const maintenance = tools.filter(t => t.status === 'на обслуживании').length;
            const reserved = tools.filter(t => t.status === 'забронирован').length;
            const activeRentals = rentals.filter(r => r.status === 'активна').length;
            const bookings = rentals.filter(r => r.status === 'забронирована').length;
            const today = todayStr();
            const revenueToday = rentals.filter(r => r.status === 'закрыта' && r.actual_return === today).reduce((sum, r) => sum + (r.total_cost || 0), 0);
            const revenueMonth = rentals.filter(r => r.status === 'закрыта' && r.actual_return && new Date(r.actual_return) >= new Date(new Date().setDate(1))).reduce((sum, r) => sum + (r.total_cost || 0), 0);
            const totalDeposits = rentals.filter(r => r.status === 'закрыта' && !r.deposit_returned).reduce((sum, r) => sum + (r.deposit || 0), 0);

            const todayDate = new Date(today);
            const overdue = rentals.filter(r => r.status === 'активна' && new Date(r.planned_return) < todayDate);
            const returningSoon = rentals.filter(r => r.status === 'активна' && (daysBetween(today, r.planned_return) >= 0 && daysBetween(today, r.planned_return) <= 2));

            const chartData = [];
            for (let i = 6; i >= 0; i--) {
                const d = new Date(today); d.setDate(d.getDate() - i);
                const dateStr = d.toISOString().split('T')[0];
                const dayRevenue = rentals.filter(r => r.status === 'закрыта' && r.actual_return === dateStr).reduce((sum, r) => sum + (r.total_cost || 0), 0);
                chartData.push({ date: dateStr, revenue: dayRevenue });
            }
            const maxRevenue = Math.max(...chartData.map(d => d.revenue), 1);
            const recent = [...rentals].filter(r => r.status !== 'забронирована').sort((a, b) => (b.id || '').localeCompare(a.id || '')).slice(0, 5);

            const statusCounts = {
                'в наличии': available,
                'в аренде': rented,
                'на обслуживании': maintenance,
                'забронирован': reserved
            };
            const totalStatus = total || 1;
            const pieData = Object.entries(statusCounts).map(([label, count]) => ({
                label,
                count,
                percent: (count / totalStatus * 100).toFixed(1)
            }));

            let html = `
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h1>Дашборд</h1>
                <div>
                    <button class="btn btn-sm btn-outline-secondary me-2" onclick="toggleDarkMode()" data-tooltip="Тёмная тема">
                        <i class="bi bi-moon"></i>
                    </button>
                    <button class="btn btn-sm btn-outline-secondary" onclick="navigate('history')" data-tooltip="Перейти в историю">
                        <i class="bi bi-clock-history"></i>
                    </button>
                </div>
            </div>
            <div class="row g-3 mb-4">
                ${overdue.length > 0 ? `
                <div class="col-md-6">
                    <div class="card text-bg-danger card-dashboard">
                        <div class="card-body">

        window._saveRental = async function(e) {
            e.preventDefault();
            const clientId = document.getElementById('rClient').value;
            const toolId = document.getElementById('rTool').value;
            const days = parseInt(document.getElementById('rDays').value) || 1;
            const issueDate = document.getElementById('rDate').value;
            const comment = document.getElementById('rComment').value.trim();
            const reserve = document.getElementById('rReserve').checked;

            if (!clientId) { showToast('Выберите клиента', 'danger'); return; }
            if (!toolId) { showToast('Выберите инструмент', 'danger'); return; }

            const tool = getToolById(toolId);
            if (!tool || (tool.status !== 'в наличии' && tool.status !== 'забронирован')) {
                showToast('Инструмент недоступен', 'danger');
                return;
            }
            if (tool.status === 'забронирован' && tool.reserved_until) {
                if (new Date(tool.reserved_until) < new Date(issueDate)) {
                    showToast('Бронь на этот инструмент истекла. Обновите страницу.', 'danger');
                    return;
                }
            }

            const planned = new Date(issueDate);
            planned.setDate(planned.getDate() + days);

            const rental = {
                id: genId(),
                rental_number: 'AR-' + Date.now().toString(36).toUpperCase(),
                client_id: clientId,
                tool_id: toolId,
                issue_date: issueDate,
                planned_return: planned.toISOString().split('T')[0],
                actual_return: null,
                price_per_day: tool.price_per_day,
                total_cost: tool.price_per_day * days,
                deposit: tool.deposit,
                status: reserve ? 'забронирована' : 'активна',
                return_condition: '',
                comment: comment,
                deposit_returned: false
            };
            const toolUpdate = {
                status: reserve ? 'забронирован' : 'в аренде',
                reserved_until: reserve ? issueDate : null
            };

            showSpinner();
            const { error: toolError } = await supabase.from('tools').update(toolUpdate).eq('id', toolId);
            if (toolError) { showToast('Ошибка обновления инструмента: ' + toolError.message, 'danger'); hideSpinner(); return; }
            const { error: rentalError } = await supabase.from('rentals').insert(rental);
            if (rentalError) { showToast('Ошибка создания аренды: ' + rentalError.message, 'danger'); hideSpinner(); return; }
            await refreshAllData();
            hideSpinner();
            showToast('Аренда оформлена', 'success');
            navigate('dashboard');
        };

        function renderReturnRental(container) {
            const active = rentals.filter(r => r.status === 'активна');
            let opts = active.map(r => {
                const c = getClientById(r.client_id);
                const t = getToolById(r.tool_id);
                return `<option value="${r.id}">${r.rental_number} — ${t ? t.model : 'Удалён'} (${c ? c.name : 'Удалён'})</option>`;
            }).join('');
            const today = todayStr();

            let html = `
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h1><i class="bi bi-arrow-return-left me-2"></i>Возврат инструмента</h1>
                <button class="btn btn-secondary" data-action="goBack"><i class="bi bi-arrow-left"></i> Назад</button>
            </div>
            ${active.length === 0 ? '<div class="alert alert-info">Нет активных аренд.</div>' : `
            <form onsubmit="return false;">
                <div class="mb-3">
                    <label>Активная аренда</label>
                    <select id="retRental" class="form-select" required>
                        <option value="">— Выберите —</option>
                        ${opts}
                    </select>
                </div>
                <div class="mb-3"><label>Фактическая дата возврата</label><input id="retDate" type="date" class="form-control" value="${today}" required /></div>
                <div class="mb-3">
                    <label>Состояние инструмента</label>
                    <select id="retCondition" class="form-select">
                        <option value="Отличное">Отличное</option>
                        <option value="Хорошее" selected>Хорошее</option>
                        <option value="Требует ремонта">Требует ремонта</option>
                        <option value="Неисправен">Неисправен</option>
                    </select>
                </div>
                <div class="mb-3 form-check">
                    <input class="form-check-input" type="checkbox" id="retDepositReturned">
                    <label class="form-check-label" for="retDepositReturned">Залог возвращён</label>
                </div>
                <div class="mb-3">
                    <button type="button" class="btn btn-success" onclick="window._returnRental(false)" data-tooltip="Принять возврат">Принять возврат</button>
                    <button type="button" class="btn btn-warning" onclick="window._returnRental(true)" data-tooltip="Отправить на ТО">Отправить на ТО</button>
                </div>
            </form>`}
            <button class="btn btn-secondary mt-3" onclick="navigate('dashboard')">На главную</button>`;
            render(container, html);
        }

        window._returnRental = async function(sendToRepair) {
            const rentalId = document.getElementById('retRental').value;
            const actualReturn = document.getElementById('retDate').value;
            const condition = document.getElementById('retCondition') ? document.getElementById('retCondition').value : 'Хорошее';
            const depositReturned = document.getElementById('retDepositReturned').checked;
            if (!rentalId) { showToast('Выберите аренду', 'danger'); return; }
            const rental = rentals.find(r => r.id === rentalId);
            if (!rental) return;
            const planned = new Date(rental.planned_return);
            const actual = new Date(actualReturn);
            let totalCost = rental.total_cost;
            if (actual > planned) {
                const extraDays = Math.ceil((actual - planned) / (1000 * 60 * 60 * 24));
                totalCost += extraDays * rental.price_per_day;
            }
            showSpinner();
            await supabase.from('rentals').update({
                actual_return: actualReturn,
                status: 'закрыта',
                return_condition: condition,
                total_cost: totalCost,
                deposit_returned: depositReturned
            }).eq('id', rentalId);
            const toolId = rental.tool_id;
            const toolUpdate = sendToRepair
                ? { status: 'на обслуживании', repair_reason: condition, repair_date: actualReturn }
                : { status: 'в наличии', repair_reason: '', repair_date: null };
            await supabase.from('tools').update(toolUpdate).eq('id', toolId);
            await refreshAllData();
            hideSpinner();
            showToast('Инструмент возвращён', 'success');
            navigate('dashboard');
        };

        // ---------- ТО ----------
        function renderRepair(container) {
            const repairTools = tools.filter(t => t.status === 'на обслуживании');
            let html = `
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h1><i class="bi bi-wrench me-2"></i>Инструменты на ТО</h1>
                <button class="btn btn-secondary" data-action="goBack"><i class="bi bi-arrow-left"></i> Назад</button>
            </div>
            ${repairTools.length === 0 ? '<div class="alert alert-info">Нет инструментов на ТО.</div>' : `
            <div class="table-responsive"><table class="table table-hover">
                <thead><tr><th>Инв. №</th><th>Модель</th><th>Причина</th><th>Дата отправки</th><th>Действие</th></tr></thead>
                <tbody>
                ${repairTools.map(t => `
                    <tr>
                        <td>${t.inventory_number || '—'}</td>
                        <td>${t.model || '—'}</td>
                        <td>${t.repair_reason || '—'}</td>
                        <td>${formatDate(t.repair_date)}</td>
                        <td><button class="btn btn-sm btn-success" data-action="returnFromRepair" data-param="${t.id}" data-tooltip="Вернуть с ТО в наличие">Вернуть с ТО</button></td>
                    </tr>
                `).join('')}
                </tbody></table></div>`}
            `;
            render(container, html);
        }

        window.returnFromRepair = async function(toolId) {
            if (!confirm('Вернуть инструмент с ТО в наличие?')) return;
            showSpinner();
            await supabase.from('tools').update({
                status: 'в наличии',
                repair_reason: '',
                repair_date: null
            }).eq('id', toolId);
            await refreshAllData();
            hideSpinner();
            showToast('Инструмент возвращён с ТО', 'success');
            navigate('repair');
        };

        // ---------- ИСТОРИЯ ----------
        function renderHistory(container) {
            const filters = state.filters.history;
            let filtered = rentals;
            if (filters.search) {
                const s = filters.search.toLowerCase();
                filtered = filtered.filter(r => {
                    const c = getClientById(r.client_id);
                    const t = getToolById(r.tool_id);
                    return (c?.name?.toLowerCase().includes(s) || t?.model?.toLowerCase().includes(s) || r.rental_number?.toLowerCase().includes(s));
                });
            }
            if (filters.filter === 'active') filtered = filtered.filter(r => r.status === 'активна');
            else if (filters.filter === 'closed') filtered = filtered.filter(r => r.status === 'закрыта');
            else if (filters.filter === 'booked') filtered = filtered.filter(r => r.status === 'забронирована');
            if (filters.dateFrom) filtered = filtered.filter(r => r.issue_date >= filters.dateFrom);
            if (filters.dateTo) filtered = filtered.filter(r => r.planned_return <= filters.dateTo);

            const pagResult = applyPaginationAndSort(filtered, 'history');
            const { items, total, page, perPage, totalPages } = pagResult;

            let html = `
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h1><i class="bi bi-clock-history me-2"></i>История аренд</h1>
                <div>
                    <button class="btn btn-outline-success btn-sm me-2" data-action="exportCSV" data-tooltip="Экспорт в CSV">📥 CSV</button>
                    <button class="btn btn-secondary" data-action="goBack"><i class="bi bi-arrow-left"></i> Назад</button>
                </div>
            </div>
            <div class="filter-section">
                <div class="row g-2">
                    <div class="col-md-3">
                        <input type="text" class="form-control" placeholder="Поиск по клиенту, инструменту или №" data-filter="history.search" value="${filters.search}">
                    </div>
                    <div class="col-md-2">
                        <select class="form-select" data-filter="history.filter">
                            <option value="all" ${filters.filter === 'all' ? 'selected' : ''}>Все</option>
                            <option value="active" ${filters.filter === 'active' ? 'selected' : ''}>Активные</option>
                            <option value="closed" ${filters.filter === 'closed' ? 'selected' : ''}>Закрытые</option>
                            <option value="booked" ${filters.filter === 'booked' ? 'selected' : ''}>Брони</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <input type="date" class="form-control" data-dateRange="history.dateFrom" value="${filters.dateFrom}" placeholder="с">
                    </div>
                    <div class="col-md-2">
                        <input type="date" class="form-control" data-dateRange="history.dateTo" value="${filters.dateTo}" placeholder="по">
                    </div>
                    <div class="col-md-2">
                        <select class="form-select" data-perPage="history">
                            <option value="5" ${perPage === 5 ? 'selected' : ''}>5</option>
                            <option value="10" ${perPage === 10 ? 'selected' : ''}>10</option>
                            <option value="25" ${perPage === 25 ? 'selected' : ''}>25</option>
                            <option value="50" ${perPage === 50 ? 'selected' : ''}>50</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="table-responsive"><table class="table table-striped table-hover">
                <thead><tr>
                    <th data-sort="history.rental_number" style="cursor:pointer;">№ <i class="bi bi-arrow-up"></i></th>
                    <th data-sort="history.client_id" style="cursor:pointer;">Клиент <i class="bi bi-arrow-up"></i></th>
                    <th data-sort="history.tool_id" style="cursor:pointer;">Инструмент <i class="bi bi-arrow-up"></i></th>
                    <th data-sort="history.issue_date" style="cursor:pointer;">Выдача <i class="bi bi-arrow-up"></i></th>
                    <th data-sort="history.planned_return" style="cursor:pointer;">План возврат <i class="bi bi-arrow-up"></i></th>
                    <th data-sort="history.actual_return" style="cursor:pointer;">Факт возврат <i class="bi bi-arrow-up"></i></th>
                    <th data-sort="history.total_cost" style="cursor:pointer;">Сумма <i class="bi bi-arrow-up"></i></th>
                    <th>Залог</th>
                    <th>Залог возвращён</th>
                    <th>Состояние</th>
                    <th>Комментарий</th>
                    <th>Статус</th>
                    <th>Действие</th>
                </tr></thead>
                <tbody>
                ${items.length === 0 ? '<tr><td colspan="13" class="text-center text-muted">Нет записей</td></tr>' :
                    items.map(r => {
                        const c = getClientById(r.client_id);
                        const t = getToolById(r.tool_id);
                        const canDelete = r.status !== 'активна' && r.status !== 'забронирована';
                        return `<tr>
                            <td>${r.rental_number || '—'}</td>
                            <td>${c ? c.name : 'Удалён'}</td>
                            <td>${t ? t.model : 'Удалён'}</td>
                            <td>${formatDate(r.issue_date)}</td>
                            <td>${formatDate(r.planned_return)}</td>
                            <td>${formatDate(r.actual_return)}</td>
                            <td>${r.total_cost || 0} ₽</td>
                            <td>${r.deposit || 0} ₽</td>
                            <td>${r.deposit_returned ? '✅ Да' : '❌ Нет'}</td>
                            <td>${r.return_condition || '—'}</td>
                            <td>${r.comment || '—'}</td>
                            <td><span class="badge bg-${getStatusColor(r.status)} rental-badge">${r.status || '—'}</span></td>
                            <td>${canDelete ? `<button class="btn btn-sm btn-outline-danger" data-action="deleteRental" data-param="${r.id}" data-tooltip="Удалить запись">🗑</button>` : '<span class="text-muted">—</span>'}</td>
                        </tr>`;
                    }).join('')
                }
                </tbody></table></div>
            ${totalPages > 1 ? `
            <nav><ul class="pagination">
                <li class="page-item ${page === 1 ? 'disabled' : ''}"><button class="page-link" data-action="pageHistory" data-param="${page-1}">Назад</button></li>
                ${Array.from({length: totalPages}, (_, i) => i+1).map(p => `
                    <li class="page-item ${p === page ? 'active' : ''}"><button class="page-link" data-action="pageHistory" data-param="${p}">${p}</button></li>
                `).join('')}
                <li class="page-item ${page === totalPages ? 'disabled' : ''}"><button class="page-link" data-action="pageHistory" data-param="${page+1}">Вперёд</button></li>
            </ul></nav>
            ` : ''}
            `;
            render(container, html);
        }

        window.pageHistory = function(page) { state.pagination.history.page = parseInt(page); renderCurrentPage(); };
        window.exportCSV = function() {
            if (rentals.length === 0) { showToast('Нет данных для экспорта', 'warning'); return; }
            let csv = '№,Клиент,Инструмент,Выдача,План возврат,Факт возврат,Цена/сутки,Сумма,Залог,Залог возвращён,Состояние,Комментарий,Статус\n';
            rentals.forEach(r => {
                const c = getClientById(r.client_id);
                const t = getToolById(r.tool_id);
                csv += `"${r.rental_number || ''}","${c ? c.name : ''}","${t ? t.model : ''}",`;
                csv += `"${formatDate(r.issue_date)}","${formatDate(r.planned_return)}","${formatDate(r.actual_return)}",`;
                csv += `"${r.price_per_day || 0}","${r.total_cost || 0}","${r.deposit || 0}","${r.deposit_returned ? 'Да' : 'Нет'}",`;
                csv += `"${r.return_condition || ''}","${r.comment || ''}","${r.status || ''}"\n`;
            });
            const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `аренды_${todayStr()}.csv`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(link.href);
            showToast('CSV скачан', 'success');
        };
        window.deleteRental = async function(rentalId) {
            if (!confirm('Удалить эту запись?')) return;
            const rental = rentals.find(r => r.id === rentalId);
            if (!rental) return;
            if (rental.status === 'активна' || rental.status === 'забронирована') {
                showToast('Нельзя удалить активную аренду или бронь', 'danger');
                return;
            }
            showSpinner();
            await supabase.from('rentals').delete().eq('id', rentalId);
            await refreshAllData();
            hideSpinner();
            showToast('Запись удалена', 'success');
            navigate('history');
        };

        // ============================================================
        // АВТОРИЗАЦИЯ
        // ============================================================
        window.login = async function(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            showSpinner();
            const { data, error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) { showToast('Ошибка входа: ' + error.message, 'danger'); hideSpinner(); return; }
            if (data.user) {
                document.getElementById('loginPage').classList.add('hidden');
                document.getElementById('registerPage').classList.add('hidden');
                document.getElementById('mainApp').classList.remove('hidden');
                document.getElementById('mainNav').style.display = 'flex';
                await refreshAllData();
                hideSpinner();
                navigate('dashboard');
            }
        };

        window.register = async function(e) {
            e.preventDefault();
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            showSpinner();
            const { data, error } = await supabase.auth.signUp({ email, password });
            if (error) { showToast('Ошибка регистрации: ' + error.message, 'danger'); hideSpinner(); return; }
            hideSpinner();
            showToast('Регистрация успешна! Теперь войдите.', 'success');
            showLogin();
        };

        window.logout = async function() {
            await supabase.auth.signOut();
            document.getElementById('loginPage').classList.remove('hidden');
            document.getElementById('registerPage').classList.add('hidden');
            document.getElementById('mainApp').classList.add('hidden');
            document.getElementById('mainNav').style.display = 'none';
            tools = []; clients = []; rentals = [];
            showToast('Вы вышли', 'warning');
        };

        window.showRegister = function() {
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('registerPage').classList.remove('hidden');
        };
        window.showLogin = function() {
            document.getElementById('registerPage').classList.add('hidden');
            document.getElementById('loginPage').classList.remove('hidden');
        };

        // ============================================================
        // ТЁМНАЯ ТЕМА
        // ============================================================
        function toggleDarkMode() {
            state.darkMode = !state.darkMode;
            document.body.classList.toggle('dark-mode', state.darkMode);
            localStorage.setItem('darkMode', state.darkMode);
        }
        if (localStorage.getItem('darkMode') === 'true') {
            state.darkMode = true;
            document.body.classList.add('dark-mode');
        }
        window.toggleDarkMode = toggleDarkMode;

        // ============================================================
        // ИНИЦИАЛИЗАЦИЯ
        // ============================================================
        async function checkSession() {
            const { data: { user } } = await supabase.auth.getUser();
            if (user) {
                document.getElementById('loginPage').classList.add('hidden');
                document.getElementById('registerPage').classList.add('hidden');
                document.getElementById('mainApp').classList.remove('hidden');
                document.getElementById('mainNav').style.display = 'flex';
                await refreshAllData();
                renderCurrentPage();
            } else {
                document.getElementById('loginPage').classList.remove('hidden');
                document.getElementById('registerPage').classList.add('hidden');
                document.getElementById('mainApp').classList.add('hidden');
                document.getElementById('mainNav').style.display = 'none';
            }
        }

        checkSession();
    })();
</script>
</body>
</html>
